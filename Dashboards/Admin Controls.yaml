            entity: input_number.door_sensors_expected_count
            name: Expected count
            show_entity_picture: false
            hide_state: true
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
          - type: tile
            entity: input_number.door_sensors_battery_threshold
            name: Battery threshold
            hide_state: true
            vertical: false
            features_position: inline
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.door_sensors_availability_timeout_minutes
            name: Availability timeout
            hide_state: true
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
          - type: tile
            entity: number.door_sensors_available_count
            name: Available count
            color: grey
            vertical: false
            tap_action:
              action: none
            features_position: bottom
          - type: tile
            entity: number.door_sensors_discharged_count
            name: Discharged count
            color: grey
            vertical: false
            tap_action:
              action: none
            features_position: bottom
