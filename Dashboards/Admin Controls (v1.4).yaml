views:
  - type: sections
    badges:
      - type: entity
        entity: sensor.device_health_status
        name: Status
        icon: mdi:check-circle-outline
        color: green
        show_name: true
        show_state: true
        visibility:
          - condition: state
            entity_id: sensor.device_health_status
            state: Healthy
      - type: entity
        entity: sensor.device_health_status
        name: Status
        icon: mdi:alert-outline
        color: orange
        show_name: true
        show_state: true
        visibility:
          - condition: state
            entity_id: sensor.device_health_status
            state: Warning
      - type: entity
        entity: sensor.device_health_status
        name: Status
        icon: mdi:alert-circle-outline
        color: red
        show_name: true
        show_state: true
        visibility:
          - condition: state
            entity_id: sensor.device_health_status
            state: Critical
      - type: entity
        entity: sensor.device_health_status
        name: Status
        icon: mdi:help-circle-outline
        color: grey
        show_name: true
        show_state: true
        visibility:
          - condition: state
            entity_id: sensor.device_health_status
            state:
              - Unknown
              - unknown
              - unavailable
      - type: entity
        entity: number.device_health_unavailable_count
        name: Unavailable
        icon: mdi:close-circle-outline
        show_name: true
        show_state: true
        visibility:
          - condition: numeric_state
            entity_id: number.device_health_unavailable_count
            below: 1
      - type: entity
        entity: number.device_health_unavailable_count
        name: Unavailable
        icon: mdi:close-circle-outline
        color: red
        show_name: true
        show_state: true
        visibility:
          - condition: numeric_state
            entity_id: number.device_health_unavailable_count
            above: 0
      - type: entity
        entity: number.device_health_discharged_count
        name: Discharged
        icon: mdi:battery-alert-variant-outline
        show_name: true
        show_state: true
        visibility:
          - condition: numeric_state
            entity_id: number.device_health_discharged_count
            below: 1
      - type: entity
        entity: number.device_health_discharged_count
        name: Discharged
        icon: mdi:battery-alert-variant-outline
        color: red
        show_name: true
        show_state: true
        visibility:
          - condition: numeric_state
            entity_id: number.device_health_discharged_count
            above: 0
      - type: entity
        entity: number.device_health_mismatch_count
        name: Mismatches
        icon: mdi:alert-outline
        show_name: true
        show_state: true
        visibility:
          - condition: numeric_state
            entity_id: number.device_health_mismatch_count
            below: 1
      - type: entity
        entity: number.device_health_mismatch_count
        name: Mismatches
        icon: mdi:alert-outline
        color: red
        show_name: true
        show_state: true
        visibility:
          - condition: numeric_state
            entity_id: number.device_health_mismatch_count
            above: 0
      - type: entity
        entity: number.untracked_zigbee_sensors_unavailable_ignore_count
        name: Ignored
        icon: mdi:eye-off-outline
        show_name: true
        show_state: true
        visibility:
          - condition: numeric_state
            entity_id: number.untracked_zigbee_sensors_unavailable_ignore_count
            below: 1
      - type: entity
        entity: number.untracked_zigbee_sensors_unavailable_ignore_count
        name: Ignored
        icon: mdi:eye-off-outline
        color: yellow
        show_name: true
        show_state: true
        visibility:
          - condition: numeric_state
            entity_id: number.untracked_zigbee_sensors_unavailable_ignore_count
            above: 0
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Door sensors
            heading_style: title
            icon: mdi:door
            badges:
              - type: entity
                entity: number.door_sensors_unavailable_count
                name: Unavailable
                icon: mdi:close-circle-outline
                color: red
                show_state: true
                visibility:
                  - condition: numeric_state
                    entity_id: number.door_sensors_unavailable_count
                    above: 0
              - type: entity
                entity: number.door_sensors_discharged_count
                name: Discharged
                icon: mdi:battery-alert-variant-outline
                color: deep-orange
                show_state: true
                visibility:
                  - condition: numeric_state
                    entity_id: number.door_sensors_discharged_count
                    above: 0
          - type: tile
            entity: input_number.door_sensors_expected_count
            name: Expected count
            color: grey
            show_entity_picture: false
            hide_state: true
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            visibility:
              - condition: template
                value_template: >-
                  {% set available = states('number.door_sensors_available_count') %}
                  {% set unavailable = states('number.door_sensors_unavailable_count') %}
                  {% set expected = states('input_number.door_sensors_expected_count') %}
                  {{ is_number(available) and is_number(unavailable) and is_number(expected)
                     and ((available | float(0)) + (unavailable | float(0))) == (expected | float(0)) }}
          - type: tile
            visibility:
              - condition: template
                value_template: >-
                  {% set available = states('number.door_sensors_available_count') %}
                  {% set unavailable = states('number.door_sensors_unavailable_count') %}
                  {% set expected = states('input_number.door_sensors_expected_count') %}
                  {{ not (is_number(available) and is_number(unavailable) and is_number(expected)
                     and ((available | float(0)) + (unavailable | float(0))) == (expected | float(0))) }}
            entity: input_number.door_sensors_expected_count
            name: Expected count
            color: amber
            show_entity_picture: false
            hide_state: true
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
          - type: tile
            entity: input_number.door_sensors_battery_threshold
            name: Battery threshold
            hide_state: true
            vertical: false
            features_position: inline
            features:
              - type: numeric-input
