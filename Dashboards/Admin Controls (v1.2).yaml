views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Door sensors
            heading_style: title
            icon: mdi:door
          - type: tile
            entity: input_number.door_sensors_expected_count
            name: Expected count
            color: grey
            show_entity_picture: false
            hide_state: true
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            visibility:
              - condition: template
                value_template: >-
                  {% set available = states('number.door_sensors_available_count') %}
                  {% set unavailable = states('number.door_sensors_unavailable_count') %}
                  {% set expected = states('input_number.door_sensors_expected_count') %}
                  {{ is_number(available) and is_number(unavailable) and is_number(expected)
                     and ((available | float(0)) + (unavailable | float(0))) == (expected | float(0)) }}
          - type: tile
            visibility:
              - condition: template
                value_template: >-
                  {% set available = states('number.door_sensors_available_count') %}
                  {% set unavailable = states('number.door_sensors_unavailable_count') %}
                  {% set expected = states('input_number.door_sensors_expected_count') %}
                  {{ not (is_number(available) and is_number(unavailable) and is_number(expected)
                     and ((available | float(0)) + (unavailable | float(0))) == (expected | float(0))) }}
            entity: input_number.door_sensors_expected_count
            name: Expected count
            color: amber
            show_entity_picture: false
            hide_state: true
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
          - type: tile
            entity: input_number.door_sensors_battery_threshold
            name: Battery threshold
            hide_state: true
            vertical: false
            features_position: inline
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.door_sensors_availability_timeout_minutes
            name: Availability timeout
            hide_state: true
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
          - type: tile
            entity: number.door_sensors_available_count
            name: Available count
            color: grey
            vertical: false
            tap_action:
              action: none
            features_position: bottom
          - type: tile
            entity: number.door_sensors_discharged_count
            name: Discharged count
            color: grey
            vertical: false
            tap_action:
              action: none
            features_position: bottom
            visibility:
              - condition: numeric_state
                entity_id: number.door_sensors_discharged_count
                below: 1
          - type: tile
            visibility:
              - condition: numeric_state
                entity_id: number.door_sensors_discharged_count
                above: 0
            entity: number.door_sensors_discharged_count
            name: Discharged count
            color: deep-orange
            vertical: false
            tap_action:
              action: none
            features_position: bottom
          - type: tile
            entity: number.door_sensors_unavailable_count
            name: Unavailable count
            color: grey
            vertical: false
            tap_action:
              action: none
            features_position: bottom
            visibility:
              - condition: numeric_state
                entity_id: number.door_sensors_unavailable_count
                below: 1
          - type: tile
            visibility:
              - condition: numeric_state
                entity_id: number.door_sensors_unavailable_count
                above: 0
            entity: number.door_sensors_unavailable_count
            name: Unavailable count
            color: red
            vertical: false
            tap_action:
              action: none
            features_position: bottom
