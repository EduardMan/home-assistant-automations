# System Health (v1.0) tab: built-in Sections/Tile/Badge cards.
# Each metric is independently editable in the Home Assistant dashboard editor.
# System Monitor IDs are confirmed from this instance's Entities list.
# Battery and Backup entity IDs still need confirmation in HA; missing ones remain visible.
  - type: sections
    badges:
      - type: entity
        entity: sensor.uptime
        name: Uptime
        show_name: true
        show_state: true
        time_format: total
      - type: entity
        entity: sensor.system_monitor_memory_usage
        name: RAM
        show_name: true
        show_state: true
      - type: entity
        entity: sensor.system_monitor_processor_use
        name: CPU
        show_name: true
        show_state: true
      - type: entity
        entity: sensor.system_monitor_processor_temperature
        name: CPU Temp
        show_name: true
        show_state: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Server
