views:
  - type: sections
    header:
      layout: center
      card:
        type: markdown
        content: |-
          {% set categories = ['door_sensors', 'moisture_sensors', 'motion_sensors', 'temperature_sensors', 'smoke_sensors', 'moisture_valves', 'natural_gas_sensors', 'heating_thermostats'] -%}
          {% set availability_categories = categories + ['untracked_zigbee_sensors', 'gsm_modules'] -%}
          {% set battery_categories = ['door_sensors', 'moisture_sensors', 'motion_sensors', 'temperature_sensors', 'smoke_sensors', 'heating_thermostats', 'untracked_zigbee_sensors'] -%}
          {% set check = namespace(unavailable=0, discharged=0, mismatches=0, complete=true) -%}
          {% for category in availability_categories -%}
            {% set value = states('number.' ~ category ~ '_unavailable_count') -%}
            {% if is_number(value) -%}
              {% set check.unavailable = check.unavailable + (value | int(0)) -%}
            {% else -%}
              {% set check.complete = false -%}
            {% endif -%}
          {% endfor -%}
          {% for category in battery_categories -%}
            {% set value = states('number.' ~ category ~ '_discharged_count') -%}
            {% if is_number(value) -%}
              {% set check.discharged = check.discharged + (value | int(0)) -%}
            {% else -%}
              {% set check.complete = false -%}
            {% endif -%}
          {% endfor -%}
          {% for category in categories -%}
            {% set available = states('number.' ~ category ~ '_available_count') -%}
            {% set unavailable = states('number.' ~ category ~ '_unavailable_count') -%}
            {% set expected = states('input_number.' ~ category ~ '_expected_count') -%}
            {% if is_number(available) and is_number(unavailable) and is_number(expected) -%}
              {% if (available | int(0)) + (unavailable | int(0)) != (expected | int(0)) -%}
                {% set check.mismatches = check.mismatches + 1 -%}
              {% endif -%}
            {% else -%}
              {% set check.complete = false -%}
            {% endif -%}
          {% endfor -%}
          {% set ignored_state = states('number.untracked_zigbee_sensors_unavailable_ignore_count') -%}
          {% if is_number(ignored_state) -%}
            {% set ignored = ignored_state | int(0) -%}
          {% else -%}
            {% set ignored = 0 -%}
            {% set check.complete = false -%}
          {% endif -%}
          {% if check.unavailable > 0 -%}
            {% set status = '<font color="#D32F2F"><ha-icon icon="mdi:alert-circle-outline"></ha-icon></font> **Обнаружены проблемы**' -%}
          {% elif check.discharged > 0 or check.mismatches > 0 -%}
            {% set status = '<font color="#B7791F"><ha-icon icon="mdi:alert-outline"></ha-icon></font> **Требует внимания**' -%}
          {% elif not check.complete -%}
            {% set status = '<ha-icon icon="mdi:help-circle-outline"></ha-icon> **Не удалось полностью проверить состояние**' -%}
          {% else -%}
            {% set status = '<font color="#218343"><ha-icon icon="mdi:check-circle-outline"></ha-icon></font> **Проблем не обнаружено**' -%}
          {% endif -%}
          {% set details = [] -%}
          {% if check.unavailable > 0 -%}
            {% set details = details + ['<font color="#D32F2F"><ha-icon icon="mdi:wifi-off"></ha-icon></font> ' ~ check.unavailable ~ '&nbsp;недоступно'] -%}
          {% endif -%}
          {% if check.discharged > 0 -%}
            {% set details = details + ['<font color="#B7791F"><ha-icon icon="mdi:battery-low"></ha-icon></font> ' ~ check.discharged ~ '&nbsp;разряжено'] -%}
          {% endif -%}
          {% if check.mismatches > 0 -%}
            {% set n = check.mismatches -%}
            {% set noun = 'расхождение' if n % 10 == 1 and n % 100 != 11 else ('расхождения' if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'расхождений') -%}
            {% set details = details + ['<font color="#B7791F"><ha-icon icon="mdi:alert-outline"></ha-icon></font> ' ~ n ~ '&nbsp;' ~ noun] -%}
          {% endif -%}
          {% if not check.complete -%}
            {% set details = details + ['<ha-icon icon="mdi:help-circle-outline"></ha-icon> Неполные данные'] -%}
          {% endif -%}
          {% set ignored_noun = 'исключение' if ignored % 10 == 1 and ignored % 100 != 11 else ('исключения' if ignored % 10 in [2, 3, 4] and ignored % 100 not in [12, 13, 14] else 'исключений') -%}
          {{ ([status] + details + (['<ha-icon icon="mdi:information-outline"></ha-icon> Контроль доступности: ' ~ ignored ~ '&nbsp;' ~ ignored_noun] if ignored > 0 else [])) | join('<br><br>') }}
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Door sensors
            heading_style: title
            icon: mdi:door
            badges:
              - type: entity
                entity: number.door_sensors_unavailable_count
                name: Unavailable
                icon: mdi:close-circle-outline
                color: red
                show_state: true
                visibility:
                  - condition: numeric_state
                    entity_id: number.door_sensors_unavailable_count
                    above: 0
              - type: entity
                entity: number.door_sensors_discharged_count
                name: Discharged
                icon: mdi:battery-alert-variant-outline
                color: deep-orange
                show_state: true
                visibility:
                  - condition: numeric_state
                    entity_id: number.door_sensors_discharged_count
                    above: 0
          - type: tile
            entity: input_number.door_sensors_expected_count
            name: Expected count
            color: grey
            show_entity_picture: false
            hide_state: true
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            visibility:
              - condition: template
                value_template: >-
                  {% set available = states('number.door_sensors_available_count') %}
                  {% set unavailable = states('number.door_sensors_unavailable_count') %}
                  {% set expected = states('input_number.door_sensors_expected_count') %}
                  {{ is_number(available) and is_number(unavailable) and is_number(expected)
                     and ((available | float(0)) + (unavailable | float(0))) == (expected | float(0)) }}
          - type: tile
            visibility:
              - condition: template
                value_template: >-
                  {% set available = states('number.door_sensors_available_count') %}
                  {% set unavailable = states('number.door_sensors_unavailable_count') %}
                  {% set expected = states('input_number.door_sensors_expected_count') %}
                  {{ not (is_number(available) and is_number(unavailable) and is_number(expected)
                     and ((available | float(0)) + (unavailable | float(0))) == (expected | float(0))) }}
            entity: input_number.door_sensors_expected_count
            name: Expected count
            color: amber
            show_entity_picture: false
            hide_state: true
            vertical: false
            features:
