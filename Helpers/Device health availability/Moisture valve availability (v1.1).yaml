# Сенсор отображающий доступность определенного водопроводного крана.
# Если _last_seen определенного крана превышает настройку таймаута, то кран считается недоступным
# dependencies:
#   - Moisture valves availability timeout minutes (Helper)
name: Moisture valve {{ meaningful name}} availability (v1.1)
type: Template binary sensor
deviceClass: Connectivity
device: {{ intended device }}
label: moisture valve
visible: false
entityId: {{ keep autogenerated but remove _v1_0 at the end. MUST end with _availability }}
state:
  {% set required_label = 'moisture_valve' %}
  {% set last_seen_entity_id = 'sensor.{{ entity_id }}_last_seen' %}
  {% set valve_entity = device_entities(device_id(last_seen_entity_id)) | select('match', 'valve') | list %}

  {% if (valve_entity | length != 1) %}
    {{ false }}
  {% elif (required_label in (valve_entity | first | labels)) %}
    {{ (as_timestamp(now()) - as_timestamp(states(last_seen_entity_id))) <
      (states('input_number.moisture_valves_availability_timeout_minutes') | int * 60) }}
  {% else %}
    {{ false }}
  {% endif %}

