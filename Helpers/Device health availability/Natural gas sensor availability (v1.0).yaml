# Сенсор отображающий доступность определенного датчика утечки газа.
# Если _last_seen определенного датчика превышает настройку таймаута, то датчик считается недоступным
name: Natural Gas sensor {{ meaningful name}} availability (v1.0)
type: Template binary sensor
deviceClass: Connectivity
device: {{ intended device }}
label: natural gas
entityId: {{ keep autogenerated but remove _v1_0 at the end. MUST end with _availability }}
state:
  {# CHANGE PLACEHOLDER #}
  {# set your device name, i.e. 'button.lumi_mcn02_5be0_info' #}
  {% set xiaomi_miot_device_name = {{ your_device_name_placeholder }} %}
  {% set updated_at = state_attr(xiaomi_miot_device_name, 'updated_at') %}

  {{ state_attr(xiaomi_miot_device_name, 'available') is true and
     updated_at is not none and
     (as_timestamp(now()) - as_timestamp(updated_at)) <
     (states('input_number.natural_gas_sensors_availability_timeout_minutes') | int * 60)
  }}
