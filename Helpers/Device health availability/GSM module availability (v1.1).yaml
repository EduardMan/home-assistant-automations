# Сенсор отображающий доступность определенного GSM модуля.
# Ориентируемся по свойству last_updated сенсора _rssi у GSM модуля. ВАЖНО: стандартное поведение сенсора такого,
# что last_updated не будет меняться, если не меняется значение самого сенсора и => если сила сигнала будет всегда одним и тем же
# значением, мы по ошибке будем считать, что модуль не доступен
# Необходимо проставить force_update в true (https://esphome.io/components/sensor/)
# dependencies:
#   - GSM module availability timeout minutes (Helper)
name: GSM module {{ meaningful name}} availability (v1.1)
type: Template binary sensor
deviceClass: Connectivity
device: {{ intended device }}
label: GSM
entityId: {{ keep autogenerated but remove _v1_0 at the end. MUST end with _availability }}
state:
  {# CHANGE PLACEHOLDER #}
  {# set your heartbeat sensor entity id, i.e. 'gsm_main_module_gsm_heartbeat' #}
  {% set gsm_heartbeat_entity_id = {{ your_heartbeat_sensor_entity_id_placeholder }} %}
  {# CHANGE PLACEHOLDER #}
  {# set your heartbeat sensor entity id, i.e. 'gsm_sim800l_rssi' #}
  {% set gsm_rssi_entity_id = {{ your_rssi_sensor_entity_id_placeholder }} %}
  {% set availability_timeout_minutes = states('input_number.gsm_modules_availability_timeout_minutes') | int * 60 %}

  {{ ((as_timestamp(now()) - as_timestamp(states['sensor.' ~ gsm_heartbeat_entity_id].last_updated)) < availability_timeout_minutes)
  or ((as_timestamp(now()) - as_timestamp(states['sensor.' ~ gsm_rssi_entity_id].last_updated)) < availability_timeout_minutes) }}
