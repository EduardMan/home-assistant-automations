# Сенсор отображающий доступность определенного термостата отопления.
# Если _last_seen определенного термостата превышает настройку таймаута, то датчик считается недоступным
# dependencies:
#   - Heating thermostats availability timeout minutes (Helper)
name: Heating thermostat {{ meaningful name}} availability (v1.0)
type: Template binary sensor
deviceClass: Connectivity
device: {{ intended device }}
label: heating thermostat
visible: false
entityId: {{ keep autogenerated but remove _v1_0 at the end. MUST end with _availability }}
state: {{ (as_timestamp(now()) - as_timestamp(states('sensor.{{ entity_id }}_last_seen'))) < 
  (states('input_number.heating_thermostats_availability_timeout_minutes') | int * 60) }}
