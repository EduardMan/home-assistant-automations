# Сенсор отображает доступность умной колонки по состоянию её media_player.
# Если сущность отсутствует или её состояние unknown либо unavailable, колонка считается недоступной.
# Для каждой колонки выберите её устройство и подставьте entity_id медиаплеера.
name: Smart speaker {{ meaningful name }} availability (v1.0)
type: Template binary sensor
deviceClass: Connectivity
device: "{{ intended device }}"
label: smart speaker
visible: false
entityId: "{{ keep autogenerated but remove _v1_0 at the end. MUST end with _availability }}"
state: >-
  {{ has_value('media_player.replace_with_your_speaker') }}
