# Сенсор отображающий доступность определенного датчика дыма.
# Если _last_seen определенного датчика превышает настройку таймаута, то датчик считается недоступным
# dependencies:
#   - Smoke sensors availability timeout minutes (Helper)
name: Smoke sensor {{ meaningful name}} availability (v1.0)
type: Template binary sensor
deviceClass: Connectivity
device: {{ intended device }}
label: smoke
entityId: {{ keep autogenerated but remove _v1_0 at the end. MUST end with _availability }}
state: {{ (as_timestamp(now()) - as_timestamp(states('sensor.{{ entity_id }}_last_seen'))) < 
  (states('input_number.smoke_sensors_availability_timeout_minutes') | int * 60) }}
