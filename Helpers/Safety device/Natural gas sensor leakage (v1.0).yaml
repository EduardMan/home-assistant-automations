# Сенсор отображающий состояние (обнаружена ли утечка) определенного датчика утечки газа.
# Данный сенсор заточен под Xiaomi Honeywell Gas Alarm White (JT-BF-03MI/AW) - https://home.miot-spec.com/p/lumi.sensor_gas.mcn02
# Получение списка всех устройств спецификации miot - https://miot-spec.org/miot-spec-v2/instances?status=all
# Получение подробной спецификации miot текущей модели - https://miot-spec.org/miot-spec-v2/instance?type=urn:miot-spec-v2:device:gas-sensor:0000A022:lumi-mcn02:1
# Если получение спецификации miot текущей модели невозможно по ссылке выше,
  # то можно найти скачанную в HA по пути: /config/.storage/xiaomi_miot - urn:miot-spec-v2:device:gas-sensor:0000A022:lumi-mcn02:1.json

# НЕ ЗАБУДЬ: задать имя устройства в xiaomi_miot_device_name, можно найти в Settings -> Developer tools -> States
# НЕ ЗАБУДЬ: задать имя устройства в {{ your_device_name_placeholder }} в availability template, можно найти в Settings -> Developer tools -> States, i.e. 'button.lumi_mcn02_5be0_info'

# dependencies:
#   - Natural gas sensors leak detection threshold (Helper)
name: Natural gas sensor {{ meaningful name}} leakage (v1.0)
type: Template binary sensor
deviceClass: Gas
device: {{ intended device }}
label: natural gas
# ЗАМЕНИТЬ: заменить на availability конкретного сенсора
availability template: {{ states('binary_sensor.{{ Natural gas sensor availability (v1.0) }}_availability') }}
entityId: {{ keep autogenerated but remove _v1_0 at the end. MUST end with _gas_leak }} # i.e. datchik_utechki_gaza_truba_natural_gas_sensor_kitchen_pipe_valve_gas_leak
state:
  {# states from spec https://home.miot-spec.com/spec/lumi.sensor_gas.mcn02 #}
  {% set warming_up_status = 0 %}
  {% set normal_state_status = 1 %}
  {% set self_testing_status = 2 %}
  {% set service_life_has_ended_status = 3 %}
  {% set device_error_status = 4 %}
  {% set natural_gas_leak_status = 5 %}

  {# CHANGE PLACEHOLDER #}
  {# set your device name, i.e. 'lumi_mcn02_5be0' #}
  {% set xiaomi_miot_device_name = {{ your_device_name_placeholder }} %}

  {# gas sensor attributes #}
  {% set gas_sensor_status_attr = 'gas_sensor.status' %}
  {% set gas_sensor_concentration_attr = 'gas_sensor.gas_concentration' %}

  {# gas sensor states #}
  {% set miot_info = "button." ~ xiaomi_miot_device_name ~ "_info" %}
  {% set miot_status = "sensor." ~ xiaomi_miot_device_name ~ "_status" %}
  {% set miot_status_gas_concentration = "sensor." ~ xiaomi_miot_device_name ~ "_gas_concentration" %}

  {% set leak_detection_threshold = states('input_number.natural_gas_sensors_leak_detection_threshold') | int %}
  {% set gas_concentration = states(miot_status_gas_concentration) %}
  {% set gas_concentration_attr = state_attr(miot_info, gas_sensor_concentration_attr) %}

  {#
    1. Check gas_sensor.status of button entity, if equals 5 then leak
    2. Check status entity, if contains alarming then leak (value is unreliable and you can't trust them, so we use lower() and regex)
    3. Check gas_concentration is greater leak_detection_threshold then leak
    4. Check gas_sensor.status of button entity, if is greater leak_detection_threshold then leak
    5. Values is unreliable, so we check all of them and use regex
  #}
  {{
    state_attr(miot_info, gas_sensor_status_attr) == natural_gas_leak_status or
    states(miot_status).lower() is match '^.*alarming.*$' or
    (gas_concentration is number) and (gas_concentration | int >= leak_detection_threshold) or
    (gas_concentration_attr is number) and (gas_concentration_attr | int >= leak_detection_threshold)
  }}
