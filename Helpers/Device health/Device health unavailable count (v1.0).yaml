# Суммарное количество недоступных устройств всех категорий Device Health.
# category:
#   - Device health
# dependencies:
#   - Category *_unavailable_count (Template number)
# Если хотя бы один исходный счётчик недоступен, итоговый хелпер недоступен — частичная сумма не выдаётся за точное значение.
name: Device health unavailable count (v1.0)
type: Template number
icon: mdi:close-circle-outline
unitOfMeasurement: pcs
maximumValue: 1000
entityId: device_health_unavailable_count
visible: false
availability template: >-
  {% set entities = [
                        'number.door_sensors_unavailable_count',
                        'number.moisture_sensors_unavailable_count',
                        'number.motion_sensors_unavailable_count',
                        'number.temperature_sensors_unavailable_count',
                        'number.smoke_sensors_unavailable_count',
                        'number.moisture_valves_unavailable_count',
                        'number.natural_gas_sensors_unavailable_count',
                        'number.heating_thermostats_unavailable_count',
                        'number.untracked_zigbee_sensors_unavailable_count',
                        'number.gsm_modules_unavailable_count'
                      ]
  %}
  {% set check = namespace(complete=true) %}
  {% for entity in entities %}
    {% if not is_number(states(entity)) %}
      {% set check.complete = false %}
    {% endif %}
  {% endfor %}
  {{ check.complete }}
state: >-
  {% set entities = [
                        'number.door_sensors_unavailable_count',
                        'number.moisture_sensors_unavailable_count',
                        'number.motion_sensors_unavailable_count',
                        'number.temperature_sensors_unavailable_count',
                        'number.smoke_sensors_unavailable_count',
                        'number.moisture_valves_unavailable_count',
                        'number.natural_gas_sensors_unavailable_count',
                        'number.heating_thermostats_unavailable_count',
                        'number.untracked_zigbee_sensors_unavailable_count',
                        'number.gsm_modules_unavailable_count'
                      ]
  %}
  {% set check = namespace(total=0) %}
  {% for entity in entities %}
    {% set value = states(entity) %}
    {% if is_number(value) %}
      {% set check.total = check.total + (value | int(0)) %}
    {% endif %}
  {% endfor %}
  {{ check.total }}
