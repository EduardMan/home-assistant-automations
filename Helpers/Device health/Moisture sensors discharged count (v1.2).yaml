# Сенсор отображающий текущее количество разряженных датчиков протечки
# dependencies:
#   - Moisture sensors battery threshold (Helper)
name: Moisture sensors discharged count (v1.2)
icon: mdi:battery-alert-variant-outline
unitOfMeasurement: pcs
visible: false
type: Template number
label: moisture
entityId: moisture_sensors_discharged_count
state:
  {% set battery_threshold = states('input_number.moisture_sensors_battery_threshold') | float %}

  {% set entities = expand(label_entities("moisture") | select('match', '.*_battery$')) | list %}
  {% set filtered_threshold_entities = namespace(filtered_entities=[ ]) %}
  {% for entity_for_filter in entities %}
    {% if (entity_for_filter.state in ['unknown', 'unavailable']) or (entity_for_filter.state | float < battery_threshold) %}
      {% set filtered_threshold_entities.filtered_entities = filtered_threshold_entities.filtered_entities + [ entity_for_filter ] %}
    {% endif %}
  {% endfor %}

  {% set entities_low = expand(label_entities("moisture") | select('match', '.*_battery_low$')) | selectattr('state', 'eq', 'on') | list %}

  {% set all_entities = filtered_threshold_entities.filtered_entities + entities_low %}
  {% set ns = namespace(ids=[ ]) %}

  {% for entity in all_entities %}
    {% set id = device_id(entity.entity_id) %}
    {% if id and id not in ns.ids %}
      {% set ns.ids = ns.ids + [id] %}
    {% endif %}
  {% endfor %}

  {{ ns.ids | count }}
