# Количество категорий Device Health, в которых available + unavailable не совпадает с expected.
# category:
#   - Device health
# dependencies:
#   - Category *_available_count / *_unavailable_count (Template number)
#   - Category *_expected_count (Input number)
# Считаются КАТЕГОРИИ с расхождениями, а не разница в количестве устройств.
# Если хотя бы один исходный счётчик неизвестен, итоговый хелпер недоступен.
name: Device health mismatch count (v1.0)
type: Template number
icon: mdi:alert-outline
unitOfMeasurement: pcs
maximumValue: 100
entityId: device_health_mismatch_count
visible: false
availability template: >-
  {% set checks = [
                        (
                          'number.door_sensors_available_count',
                          'number.door_sensors_unavailable_count',
                          'input_number.door_sensors_expected_count'
                        ),
                        (
                          'number.moisture_sensors_available_count',
                          'number.moisture_sensors_unavailable_count',
                          'input_number.moisture_sensors_expected_count'
                        ),
                        (
                          'number.motion_sensors_available_count',
                          'number.motion_sensors_unavailable_count',
                          'input_number.motion_sensors_expected_count'
                        ),
                        (
                          'number.temperature_sensors_available_count',
                          'number.temperature_sensors_unavailable_count',
                          'input_number.temperature_sensors_expected_count'
                        ),
                        (
                          'number.smoke_sensors_available_count',
                          'number.smoke_sensors_unavailable_count',
                          'input_number.smoke_sensors_expected_count'
                        ),
                        (
                          'number.moisture_valves_available_count',
                          'number.moisture_valves_unavailable_count',
                          'input_number.moisture_valves_expected_count'
                        ),
                        (
                          'number.natural_gas_sensors_available_count',
                          'number.natural_gas_sensors_unavailable_count',
                          'input_number.natural_gas_sensors_expected_count'
                        ),
                        (
                          'number.heating_thermostats_available_count',
                          'number.heating_thermostats_unavailable_count',
                          'input_number.heating_thermostats_expected_count'
                        )
                      ]
  %}
  {% set check = namespace(complete=true) %}
  {% for available_entity, unavailable_entity, expected_entity in checks %}
    {% if not (is_number(states(available_entity))
       and is_number(states(unavailable_entity))
       and is_number(states(expected_entity))) %}
      {% set check.complete = false %}
    {% endif %}
  {% endfor %}
  {{ check.complete }}
state: >-
  {% set checks = [
                        (
                          'number.door_sensors_available_count',
                          'number.door_sensors_unavailable_count',
                          'input_number.door_sensors_expected_count'
                        ),
                        (
                          'number.moisture_sensors_available_count',
                          'number.moisture_sensors_unavailable_count',
                          'input_number.moisture_sensors_expected_count'
                        ),
                        (
                          'number.motion_sensors_available_count',
                          'number.motion_sensors_unavailable_count',
                          'input_number.motion_sensors_expected_count'
                        ),
                        (
                          'number.temperature_sensors_available_count',
                          'number.temperature_sensors_unavailable_count',
                          'input_number.temperature_sensors_expected_count'
                        ),
                        (
                          'number.smoke_sensors_available_count',
                          'number.smoke_sensors_unavailable_count',
                          'input_number.smoke_sensors_expected_count'
                        ),
                        (
                          'number.moisture_valves_available_count',
                          'number.moisture_valves_unavailable_count',
                          'input_number.moisture_valves_expected_count'
                        ),
                        (
                          'number.natural_gas_sensors_available_count',
                          'number.natural_gas_sensors_unavailable_count',
                          'input_number.natural_gas_sensors_expected_count'
                        ),
                        (
                          'number.heating_thermostats_available_count',
                          'number.heating_thermostats_unavailable_count',
                          'input_number.heating_thermostats_expected_count'
                        )
                      ]
  %}
  {% set check = namespace(total=0) %}
  {% for available_entity, unavailable_entity, expected_entity in checks %}
    {% set available = states(available_entity) %}
    {% set unavailable = states(unavailable_entity) %}
    {% set expected = states(expected_entity) %}
    {% if is_number(available) and is_number(unavailable) and is_number(expected) %}
      {% if (available | int(0)) + (unavailable | int(0)) != (expected | int(0)) %}
        {% set check.total = check.total + 1 %}
      {% endif %}
    {% endif %}
  {% endfor %}
  {{ check.total }}
