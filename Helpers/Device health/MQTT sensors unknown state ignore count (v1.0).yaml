# Количество MQTT-сущностей sensor и binary_sensor с лейблом mqtt_unknown_state_ignore.
# dependencies:
#   - mqtt_sensor_health_v_1_0.jinja (Custom template)
name: MQTT sensors unknown state ignore count (v1.0)
type: Template number
icon: mdi:eye-off-outline
unitOfMeasurement: pcs
maximumValue: 100
entityId: mqtt_sensors_unknown_state_ignore_count
visible: false
state: >-
  {% from 'mqtt_sensor_health_v_1_0.jinja' import get_mqtt_sensor_ids %}
