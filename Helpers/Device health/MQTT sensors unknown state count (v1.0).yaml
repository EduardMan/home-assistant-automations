# Количество MQTT-сенсоров со state = unknown.
# category:
#   - Device health
# dependencies:
#   - mqtt_sensor_health_v_1_0.jinja (Custom template)
name: MQTT sensors unknown state count (v1.0)
type: Template number
icon: mdi:progress-question
unitOfMeasurement: pcs
maximumValue: 100
entityId: mqtt_sensors_unknown_state_count
visible: false
state: >-
  {% from 'mqtt_sensor_health_v_1_0.jinja' import get_mqtt_sensors_with_unknown_state %}
  {% set unknown_mqtt_sensors = get_mqtt_sensors_with_unknown_state | as_function %}
  {{ unknown_mqtt_sensors() | count }}
