# Суммарное количество разряженных устройств из категорий с контролем батареи.
# category:
#   - Device health
# dependencies:
#   - Category *_discharged_count (Template number)
# Если хотя бы один исходный счётчик недоступен, итоговый хелпер недоступен — частичная сумма не выдаётся за точное значение.
name: Device health discharged count (v1.0)
type: Template number
icon: mdi:battery-alert-variant-outline
unitOfMeasurement: pcs
maximumValue: 1000
entityId: device_health_discharged_count
visible: false
availability template: >-
  {% set entities = [
                        'number.door_sensors_discharged_count',
                        'number.moisture_sensors_discharged_count',
                        'number.motion_sensors_discharged_count',
                        'number.temperature_sensors_discharged_count',
                        'number.smoke_sensors_discharged_count',
                        'number.heating_thermostats_discharged_count',
                        'number.untracked_zigbee_sensors_discharged_count'
                      ]
  %}
  {% set check = namespace(complete=true) %}
  {% for entity in entities %}
    {% if not is_number(states(entity)) %}
      {% set check.complete = false %}
    {% endif %}
  {% endfor %}
  {{ check.complete }}
state: >-
  {% set entities = [
                        'number.door_sensors_discharged_count',
                        'number.moisture_sensors_discharged_count',
                        'number.motion_sensors_discharged_count',
                        'number.temperature_sensors_discharged_count',
                        'number.smoke_sensors_discharged_count',
                        'number.heating_thermostats_discharged_count',
                        'number.untracked_zigbee_sensors_discharged_count'
                      ]
  %}
  {% set check = namespace(total=0) %}
  {% for entity in entities %}
    {% set value = states(entity) %}
    {% if is_number(value) %}
      {% set check.total = check.total + (value | int(0)) %}
    {% endif %}
  {% endfor %}
  {{ check.total }}
