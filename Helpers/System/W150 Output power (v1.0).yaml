# Сенсор, отображающий расчётную выходную мощность ИБП WalleCube W150 (P = U × I)
# category:
#   - System
# dependencies:
#   - sensor.w150_output_voltage (NUT)
#   - sensor.w150_output_current (NUT)
name: W150 Output power (v1.0)
type: Template sensor
icon: mdi:flash-outline
unitOfMeasurement: W
deviceClass: Power
stateClass: Measurement
entityId: w150_output_power
visible: false
availability template: >-
  {{ is_number(states('sensor.w150_output_voltage'))
     and is_number(states('sensor.w150_output_current')) }}
state: >-
  {{ (
      (states('sensor.w150_output_voltage') | float(0)) *
      (states('sensor.w150_output_current') | float(0))
  ) | round(1) }}
