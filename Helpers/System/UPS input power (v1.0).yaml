# Универсальный шаблон сенсора расчётной входной мощности ИБП (P = U × I).
# category:
#   - System
# ВАЖНО: формула P = U × I даёт активную мощность (W) для постоянного тока (DC).
# Для переменного тока (AC) U × I даёт полную мощность (VA); без коэффициента мощности нельзя считать результат ваттами.
# ЗАМЕНИТЬ: {{ meaningful name }} на название ИБП, например W150.
# ЗАМЕНИТЬ: {{ entity_id }} на общий префикс сущностей ИБП без sensor., например w150.
# Если исходные сущности названы иначе, укажи их полные entity_id в state и availability template.
name: UPS {{ meaningful name }} input power (v1.0)
type: Template sensor
device: {{ intended device }}
icon: mdi:flash
unitOfMeasurement: W
deviceClass: Power
stateClass: Measurement
displayPrecision: 1
entityId: {{ keep autogenerated but remove _v1_0 at the end. MUST end with _input_power }}
visible: false
availability template: >-
  {{ is_number(states('sensor.{{ entity_id }}_input_voltage'))
     and is_number(states('sensor.{{ entity_id }}_input_current')) }}
state: >-
  {{ (
      (states('sensor.{{ entity_id }}_input_voltage') | float(0)) *
      (states('sensor.{{ entity_id }}_input_current') | float(0))
  ) }}
