# Сенсор определяющий находится ли определенный пользователь дома.
# Для этих целей не использую встроенную сущность People для большего контроля

#i.e. Home occupied by Eduard (v1.0)
name: Home occupied by {{ name }} (v1.0)
type: Template binary sensor
deviceClass: Presence
entityId: {{ keep autogenerated but remove _v1_0 at the end }}
# В state прописываете логику согласной которой вы будете считать, что пользователь дома
# Конкретно в этом примере мы определяем по подключению смартфона к домашнему wifi
state:
  {% set home_zone = 'home' %}

  {% set device_trackers = [
    'device_tracker.{{ your device trackers }}',
    'device_tracker.{{ your device trackers }}'
  ]%}

  {{
    expand(device_trackers)
    | selectattr('state', 'eq', home_zone)
    | list
    | count > 0
  }}
