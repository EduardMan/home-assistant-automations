# Хелпер для хранения регулярок, при помощи которых можно вытащить баланс
# из USSD ответа определенного оператора
# В автоматизации достаем баланс перебирая регулярки в цикле
# Правила составления регулярных выражений:
# 1. Описать надо всю строку, т.е. регулярка начинается с ^ и заканчивается $
# 2. СУММА БАЛАНСА ОБЯЗАТЕЛЬНО ДОЛЖНА БЫТЬ В НУЛЕВОЙ ГРУППЕ, так как сумма достается через regex_findall_index(ussd_balance_regex, 0)

# Примеры сообщений с балансом:
# megafon:
# - Ваш баланс: 663.1 руб.
# mts:
# - Balance:1772,28r

# Готовые регулярки
# megafon:
# - (\\d+(?:[.,]\\d+)?)\\sр\\.\n
# mts:
# - ^Balance:(.*\\d+.*)r$
name: USSD balance extracting regexes (v1.0)
icon: mdi:regex
type: Template sensor
entityId: ussd_balance_extracting_regexes
visible: false
# Массив регулярок. В автоматизации необходимо использовать | from_json
# Здесь не применяем | to_json, так как длина сенсора ограничена 255, здесь экономим символы
value: [ "^Balance:(.*\\d+.*)r$", "^Ваш\\sбаланс:\\s(\\d+(?:[.,]\\d+)?)\\sруб\\.$" ]
