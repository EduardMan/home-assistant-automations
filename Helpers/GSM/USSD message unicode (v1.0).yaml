# Сенсор для декодирования UUSD сообщений из кодировки USC2 в Unicode
name: USSD message {{ meaningful name}} unicode (v1.0)
type: Template sensor
icon: mdi:message-text
device: {{ intended device }}
entityId: {{ keep autogenerated but remove _v1_0 at the end. }}
state:
  {# CHANGE PLACEHOLDER #}
  {# set your USSD message sensor entity_id, i.e. 'sensor.gsm_ussd_code' #}
  {% set hex_string = states({{ your_ussd_message_sensor_placeholder }}) %}

  {% if hex_string == 'unknown' %}
    {{ hex_string }}
  {% else %}
    {% set n = 4 %}
    {% if hex_string | regex_match('^[ 0-9A-Fa-f ]+$') and hex_string | length % 4 == 0 %}
      {% set unicode_sequence = namespace(sensors=[ ]) %}
      {% for i in range(0, hex_string | length, n) %}
        {% set part = hex_string[i:i+n] %}
        {% set unicode_sequence.sensors = unicode_sequence.sensors + ['\\u' + part] %}
      {% endfor %}

      {# Дополнительная защита от ошибок в from_json #}
      {% set json_string = '"' ~ unicode_sequence.sensors|join ~ '"' %}
      {{ json_string | from_json | default(hex_string) }}
    {% else %}
      {{ hex_string }}
    {% endif %}
  {% endif %}
