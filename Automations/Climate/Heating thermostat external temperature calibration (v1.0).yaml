# category
#   - Climate
# labels:
#   - scheduled
# entityId
#   - heating_thermostat_{{ meaningful name }}_external_temperature_calibration
# dependencies:
#   - sensor.{{ your external temperature sensor }} (External temperature sensor)
#   - sensor.{{ your thermostat temperature sensor }} (Heating thermostat temperature)
#   - number.{{ your thermostat calibration number }} (Heating thermostat temperature calibration)

alias: Heating thermostat {{ meaningful name }} external temperature calibration (v1.0)
description: |2-
  **Что делает:**
  Корректирует температуру радиаторного термостата по внешнему датчику.
  Сам термостат продолжает управлять радиатором и заданной температурой.

  **Как рассчитывается калибровка:**
  - Новая поправка = текущая поправка + внешняя температура − температура термостата.
  - Результат округляется до целого градуса и ограничивается диапазоном от −9 до +9 °C.
  - Если рассчитанное значение совпадает с текущим, команда термостату не отправляется.

  **Когда срабатывает:**
  - 📅 Каждые 5 минут — даже если необходима поправка всего на 1 °C.
  - 🌡️ При переходе расхождения между датчиками через порог 2 °C — внеплановая проверка.

  **Защита от лишних команд и неверных данных:**
  - Пропускает проверку, если хотя бы одно исходное значение неизвестно или недоступно.
  - Не использует показания датчиков, которые не обновлялись больше 6 часов.
  - После изменения калибровки ждёт нового отчёта температуры термостата.
  - Не требует дополнительных хелперов, таймеров или сторонних интеграций.

  **Что нужно настроить перед использованием:**
  - Замените `{{ meaningful name }}` на уникальное название термостата (латиницей в `entityId`).
  - Замените `{{ your external temperature sensor }}` на часть entity_id внешнего датчика после `sensor.`.
  - Замените `{{ your thermostat temperature sensor }}` на часть entity_id температуры термостата после `sensor.`.
  - Замените `{{ your thermostat calibration number }}` на часть entity_id калибровки после `number.`.
  - Шаблон рассчитан на термостаты с целочисленной калибровкой от −9 до +9 °C с шагом 1 °C (например, BRT-100-TRV).
    Для других моделей проверьте и при необходимости измените диапазон и шаг.
triggers:
  # Плановая проверка каждые 5 минут — при необходимости корректируем даже на 1 °C
  - id: scheduled
    trigger: time_pattern
    minutes: "/5"
  # Внеплановая проверка при переходе расхождения температур через порог 2 °C
  - id: deviation
    trigger: template
    value_template: >-
      {% set external_temperature = states('sensor.{{ your external temperature sensor }}') %}
      {% set thermostat_temperature = states('sensor.{{ your thermostat temperature sensor }}') %}
      {{ is_number(external_temperature) and is_number(thermostat_temperature)
         and (((external_temperature | float(0)) - (thermostat_temperature | float(0))) | abs) >= 2 }}
conditions:
  # Не выполняем калибровку, если хотя бы одно исходное значение недоступно
  - alias: External temperature, thermostat temperature and current calibration are numeric
    condition: template
    value_template: >-
      {{ is_number(states('sensor.{{ your external temperature sensor }}'))
         and is_number(states('sensor.{{ your thermostat temperature sensor }}'))
         and is_number(states('number.{{ your thermostat calibration number }}')) }}
  # Не используем устаревшие данные и ждём новый отчёт температуры после предыдущей калибровки
  - alias: Temperature reports are fresh and thermostat reported after calibration changed
    condition: template
    value_template: >-
      {% set external_temperature_state = states['sensor.{{ your external temperature sensor }}'] %}
      {% set thermostat_temperature_state = states['sensor.{{ your thermostat temperature sensor }}'] %}
      {% set calibration_state = states['number.{{ your thermostat calibration number }}'] %}
      {% set current_time = as_timestamp(now()) %}
      {% set max_age_seconds = 21600 %}
      {{ external_temperature_state is not none and thermostat_temperature_state is not none and calibration_state is not none
         and (current_time - as_timestamp(external_temperature_state.last_reported, 0)) <= max_age_seconds
         and (current_time - as_timestamp(thermostat_temperature_state.last_reported, 0)) <= max_age_seconds
         and as_timestamp(thermostat_temperature_state.last_reported, 0) > as_timestamp(calibration_state.last_changed, 0) }}
actions:
  # Считываем исходные значения один раз для согласованного расчёта
  - variables:
      external_temperature: "{{ states('sensor.{{ your external temperature sensor }}') | float(0) }}"
      thermostat_temperature: "{{ states('sensor.{{ your thermostat temperature sensor }}') | float(0) }}"
      current_calibration: "{{ states('number.{{ your thermostat calibration number }}') | int(0) }}"
  # Рассчитываем новую поправку с учётом уже действующей калибровки и ограничений термостата
  - variables:
      new_calibration: >-
        {% set correction = (external_temperature | float(0)) - (thermostat_temperature | float(0)) %}
        {% set result = ((current_calibration | int(0)) + correction) | round(0) | int(0) %}
        {{ [[result, -9] | max, 9] | min }}
  # Не отправляем команду, если после округления и ограничения поправка не изменилась
  - alias: Calculated calibration differs from current calibration
    condition: template
    value_template: >-
      {{ (new_calibration | int(0)) != (current_calibration | int(0)) }}
  - action: number.set_value
    metadata: {}
    target:
      entity_id: number.{{ your thermostat calibration number }}
    data:
      value: "{{ new_calibration | int(0) }}"
mode: single
