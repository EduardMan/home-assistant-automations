# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - motion_sensors_availability_checker
# dependencies:
#   - Motion sensors availability timeout minutes (Helper)
#   - Motion sensors unavailable count (Helper)
#   - Motion sensors available count (Helper)
#   - Motion sensors expected count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Motion sensors availability checker (v1.0)
description: |2-
  **Что делает:**
  Проверяет, все ли датчики движения выходят на связь.
  Если какой-то датчик не отвечает дольше заданного времени — приходит уведомление.

  **Как приходит оповещение:**
  - Если недоступны 1–2 датчика — в сообщении перечислены их названия и в каких они комнатах.
  - Если недоступны 3 или больше — показывается только общее число работающих датчиков (например, 5 из 7).

  **Когда срабатывает проверка:**
  - 📅 Каждое утро в 08:00.
  - ⚙️ Когда меняются настройки таймаута или счётчики датчиков.
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы датчики успели проснуться).
  - 🔔 Сразу после того, как вы закрыли предыдущее оповещение (чтобы перепроверить, не появились ли новые проблемы).

  **Настройки:**
  - `Motion sensors availability timeout minutes` — через сколько минут без ответа датчик считается недоступным.
  - `Motion sensors expected count` — сколько всего датчиков движения должно быть в доме.

  **Сенсоры:**
  - `Motion sensors unavailable count` — текущее число датчиков, которые не на связи.
  - `Motion sensors available count` — текущее число датчиков, которые на связи.
triggers:
  # Когда меняется настройка таймаута доступности датчиков двери
  - trigger: state
    entity_id:
      - input_number.motion_sensors_availability_timeout_minutes
  # Когда меняется количество недоступных датчиков
  - trigger: state
    entity_id:
      - number.motion_sensors_unavailable_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления недоступности датчиков
  - trigger: persistent_notification
    update_type:
      - removed
    id: persistent_notification_removed
    notification_id: motion_sensors_availability_notification
  # После запуска системы (время работы системы - настройка таймаута датчиков > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Motion sensors availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.motion_sensors_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Motion sensors availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.motion_sensors_availability_timeout_minutes') | int
          ) > 0 
      }}
actions:
  - choose:
      # Если количество недоступных датчиков менее трех, то отправляем уведомление со списком датчиков
      - conditions:
          - condition: numeric_state
            entity_id: number.motion_sensors_unavailable_count
            above: 0
            below: 3
        sequence:
          - variables:
              unavailable_motion_sensors: >
                {%
                set unavailable_filtered_motion_sensors = 
                expand(label_entities("motion") | 
                select('match', '.*_availability$')) |
                selectattr('state', '!=', 'on') | 
                map(attribute='entity_id') | list 
                %}

                {% set ns = namespace(device_names=[]) %}

                {% for motion_sensor in unavailable_filtered_motion_sensors %}
                  {% set motion_sensor_device_id = device_id(motion_sensor) %}
                  {% if motion_sensor_device_id %}
                    {% set area_id = device_attr(motion_sensor_device_id, 'area_id') %}
                    {% set area = area_name(area_id) if area_id else "Без комнаты" %}
                
                    {% set motion_sensor_name = device_attr(motion_sensor_device_id, 'name_by_user') or device_attr(motion_sensor_device_id, 'name') %}
                
                    {% set ns.device_names = ns.device_names + [motion_sensor_name ~ " (" ~ area ~")"] %}
                  {% endif %}
                {% endfor %}

                {{ ns.device_names | join("\n") }}
          - action: script.universal_notification_sender
            metadata: { }
            data:
              automation_trigger_id: "{{ trigger.id }}"
              message_text: "{{ unavailable_motion_sensors }}"
              message_title: Датчики движения недоступны!
              message_notification_id: motion_sensors_availability_notification
      # Если количество недоступных датчиков более двух, то отправляем уведомление с общим количеством недоступных датчиков
      - conditions:
          - condition: numeric_state
            entity_id: number.motion_sensors_unavailable_count
            above: 2
        sequence:
          - action: script.universal_notification_sender
            metadata: { }
            data:
              message_text: >-
                Доступно датчиков движения {{ states("number.motion_sensors_available_count") | int | string
                + "/" + states('input_number.motion_sensors_expected_count') | int | string }}
              message_title: Датчики движения недоступны!
              message_notification_id: motion_sensors_availability_notification
              automation_trigger_id: "{{ trigger.id }}"
mode: single
