# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - heating_thermostats_availability_checker
# dependencies:
#   - heating_thermostats availability timeout minutes (Helper)
#   - heating_thermostats unavailable count (Helper)
#   - heating_thermostats available count (Helper)
#   - heating_thermostats expected count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Heating thermostats availability checker (v1.0)
description: |2-
  **Что делает:**
  Проверяет, все ли термостаты отопления выходят на связь.
  Если какой-то термостат не отвечает дольше заданного времени — приходит уведомление.

  **Как приходит оповещение:**
  - Если недоступны 1–2 термостата — в сообщении перечислены их названия и в каких они комнатах.
  - Если недоступны 3 или больше — показывается только общее число работающих термостатов (например, 5 из 7).

  **Когда срабатывает проверка:**
  - 📅 Каждое утро в 08:00.
  - ⚙️ Когда меняются настройки таймаута или счётчики термостатов.
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы термостаты успели проснуться).
  - 🔔 Сразу после того, как вы закрыли предыдущее оповещение (чтобы перепроверить, не появились ли новые проблемы).

  **Настройки:**
  - `Heating thermostats availability timeout minutes` — через сколько минут без ответа термостат считается недоступным.
  - `Heating thermostats expected count` — сколько всего термостатов отопления должно быть в доме.

  **Сенсоры:**
  - `Heating thermostats unavailable count` — текущее число термостатов, которые не на связи.
  - `Heating thermostats available count` — текущее число термостатов, которые на связи.
triggers:
  # Когда меняется настройка таймаута доступности термостатов отопления
  - trigger: state
    entity_id:
      - input_number.heating_thermostats_availability_timeout_minutes
  # Когда меняется количество недоступных термостатов
  - trigger: state
    entity_id:
      - number.heating_thermostats_unavailable_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления недоступности термостатов
  - trigger: persistent_notification
    update_type:
      - removed
    id: persistent_notification_removed
    notification_id: heating_thermostats_availability_notification
  # После запуска системы (время работы системы - настройка таймаута термостатов > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Heating thermostats availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.heating_thermostats_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Heating thermostats availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.heating_thermostats_availability_timeout_minutes') | int
          ) > 0 
      }}
actions:
  - choose:
      # Если количество недоступных термостатов отопления менее трех, то отправляем уведомление со списком термостатов
      - conditions:
          - condition: numeric_state
            entity_id: number.heating_thermostats_unavailable_count
            above: 0
            below: 3
        sequence:
          - variables:
              unavailable_heating_thermostats: >
                {%
                set unavailable_filtered_heating_thermostats = 
                expand(label_entities("heating_thermostat") |
                select('match', '.*_availability$')) |
                selectattr('state', '!=', 'on') | 
                map(attribute='entity_id') | list 
                %}

                {% set ns = namespace(device_names=[]) %}

                {% for heating_thermostat in unavailable_filtered_heating_thermostats %}
                  {% set heating_thermostat_device_id = device_id(heating_thermostat) %}
                  {% if heating_thermostat_device_id %}
                    {% set area_id = device_attr(heating_thermostat_device_id, 'area_id') %}
                    {% set area_name = area_name(area_id) if area_id else "Без комнаты" %}
                
                    {% set heating_thermostat_sensor_name = 
                      device_attr(heating_thermostat_device_id, 'name_by_user') or device_attr(heating_thermostat_device_id, 'name') %}
                
                    {% set ns.device_names = ns.device_names + [heating_thermostat_sensor_name ~ " (" ~ area_name ~")"] %}
                  {% endif %}
                {% endfor %}

                {{ ns.device_names | join("\n") }}
          - action: script.universal_notification_sender
            metadata: { }
            data:
              automation_trigger_id: "{{ trigger.id }}"
              message_text: "{{ unavailable_heating_thermostats }}"
              message_title: Термостаты отопления недоступны!
              message_notification_id: heating_thermostats_availability_notification
      # Если количество недоступных термостатов более двух, то отправляем уведомление с общим количеством недоступных термостатов
      - conditions:
          - condition: numeric_state
            entity_id: number.heating_thermostats_unavailable_count
            above: 2
        sequence:
          - action: script.universal_notification_sender
            metadata: { }
            data:
              message_text: >-
                Доступно термостатов отопления {{ states("number.heating_thermostats_available_count") | int | string
                + "/" + states('input_number.heating_thermostats_expected_count') | int | string }}
              message_title: Термостаты отопления недоступны!
              message_notification_id: heating_thermostats_availability_notification
              automation_trigger_id: "{{ trigger.id }}"
mode: single
