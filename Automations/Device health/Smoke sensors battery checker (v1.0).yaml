# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - smoke_sensors_battery_checker
# dependencies:
#   - Smoke sensors availability timeout minutes (Helper)
#   - Smoke sensors battery threshold (Helper)
#   - Smoke sensors discharged count (Helper)
#   - Smoke sensors expected count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Smoke sensors battery checker (v1.0)
description: |2-
  **Что делает:**
  Проверяет, нет ли в доме датчиков задымления с низким зарядом батареи.
  Если заряд какого-то датчика опускается ниже заданного порога — приходит уведомление.

  **Как приходит оповещение:**
  - Если разряженных датчиков 1–2 — в сообщении перечислены их названия, текущий процент заряда и комната.
  - Если 3 или больше — показывается только общее количество разряженных датчиков (например, «3 из 5 датчиков задымления имеют низкий заряд»).

  **Когда срабатывает проверка:**
  - 📅 Каждое утро в 08:00.
  - ⚙️ Когда меняется количество разряженных датчиков (счётчик `Smoke sensors discharged count`).
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы датчики успели проснуться).
  - 🔔 Сразу после того, как вы закрыли уведомление о низком заряде (чтобы перепроверить, не появились ли новые разряженные).

  **Настройки:**
  - `Smoke sensors battery threshold` — порог заряда в процентах, ниже которого датчик считается разряженным.
  - `Smoke sensors expected count` — сколько всего датчиков задымления должно быть в доме.
  - `Smoke sensors availability timeout minutes` — через сколько минут без ответа датчик считается недоступным (влияет только на задержку проверки после перезагрузки).

  **Сенсоры:**
  - `Smoke sensors discharged count` — текущее число датчиков с низким зарядом батареи (обновляется автоматически).
triggers:
  # Когда меняется количество разряженных датчиков
  - trigger: state
    entity_id:
      - number.smoke_sensors_discharged_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления о разряженности датчиков
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: smoke_sensors_discharged_notification
    id: persistent_notification_removed
  # После запуска системы (время работы системы - настройка таймаута датчиков > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Smoke sensors availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.smoke_sensors_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Smoke sensors availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int -
          states('input_number.smoke_sensors_availability_timeout_minutes') | int
          ) > 0 
      }}
    enabled: true
actions:
  - choose:
      # Если количество разряженных датчиков менее трех, то отправляем уведомление со списком датчиков
      - conditions:
          - condition: numeric_state
            entity_id: number.smoke_sensors_discharged_count
            above: 0
            below: 3
        sequence:
          - variables:
              discharged_smoke_sensors: >
                {% set battery_threshold = states('input_number.smoke_sensors_battery_threshold') | float %}

                {% set entities = expand(label_entities("smoke") | select('match', '.*_battery$')) | list %}

                {# Список датчиков у которых уровень заряда ниже настроенного порога #}
                {% set filtered_threshold_entities = namespace(filtered_entities=[]) %} 
                {% for entity_for_filter in entities %}
                  {% if entity_for_filter.state | float < battery_threshold %}
                    {% set filtered_threshold_entities.filtered_entities = filtered_threshold_entities.filtered_entities + [entity_for_filter] %}
                  {% endif %}
                {% endfor %}

                {% set ns = namespace(device_names=[]) %}

                {% for entity in filtered_threshold_entities.filtered_entities %}
                  {% set dev = device_id(entity.entity_id) %}
                  {% if dev %}
                    {% set area_id = device_attr(dev, 'area_id') %}
                    {% set area = area_name(area_id) if area_id else "Без комнаты" %}

                    {% set name = device_attr(dev, 'name_by_user') or device_attr(dev, 'name') %}
                    {% set ns.device_names = ns.device_names + [name ~ " (" ~ entity.state ~ "%) - " ~ area] %}
                  {% endif %}
                {% endfor %}

                {{ ns.device_names | join("\n") }}
          - action: script.universal_notification_sender
            metadata: { }
            data:
              automation_trigger_id: "{{ trigger.id }}"
              message_text: "{{ discharged_smoke_sensors }}"
              message_title: Низкий заряд в датчиках задымления!
              message_notification_id: smoke_sensors_discharged_notification
      # Если количество разряженных датчиков более двух, то отправляем уведомление с общим количеством недоступных датчиков
      - conditions:
          - condition: numeric_state
            entity_id: number.smoke_sensors_discharged_count
            above: 2
        sequence:
          - action: script.universal_notification_sender
            metadata: { }
            data:
              message_text: >-
                В {{ states('number.smoke_sensors_discharged_count') }} 
                датчиков задымления из {{ states('input_number.smoke_sensors_expected_count') }}
                низкий заряд батареи
              message_title: Низкий заряд в датчиках задымления!
              message_notification_id: smoke_sensors_discharged_notification
              automation_trigger_id: "{{ trigger.id }}"
mode: single
