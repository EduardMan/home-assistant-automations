# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - moisture_sensors_availability_checker
# dependencies:
#   - Moisture sensors availability timeout minutes (Helper)
#   - Moisture sensors unavailable count (Helper)
#   - Moisture sensors available count (Helper)
#   - Moisture sensors expected count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Moisture sensors availability checker (v1.0)
description: >-
  **Что делает:**
  Проверяет, все ли датчики протечки выходят на связь.  
  Если какой-то датчик не отвечает дольше заданного времени — приходит уведомление.

  **Как приходит оповещение:**
  - Если недоступны 1–2 датчика — в сообщении перечислены их имена и в каких они комнатах.  
  - Если недоступны 3 или больше — показывается только общее число работающих датчиков (например, 5 из 7).

  **Когда срабатывает проверка:**
  - 📅 Каждое утро в 08:00.
  - ⚙️ Когда меняются настройки таймаута или счётчики датчиков.
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы датчики успели проснуться).
  - 🔔 Сразу после того, как вы закрыли предыдущее оповещение (чтобы перепроверить, не появились ли новые проблемы).

  **Настройки:**
  - `Moisture sensors availability timeout minutes` — через сколько минут без ответа датчик считается недоступным.  
  - `Moisture sensors expected count` — сколько всего датчиков протечки должно быть в доме.

  **Сенсоры:**
  - `Moisture sensors unavailable count` — текущее число датчиков, которые не на связи.  
  - `Moisture sensors available count` — текущее число датчиков, которые на связи.
triggers:
  # Когда меняется настройка таймаута доступности датчиков влажности
  - trigger: state
    entity_id:
      - input_number.moisture_sensors_availability_timeout_minutes
  # Когда меняется количество недоступных датчиков
  - trigger: state
    entity_id:
      - number.moisture_sensors_unavailable_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления недоступности датчиков
  - trigger: persistent_notification
    update_type:
      - removed
    id: persistent_notification_removed
    notification_id: moisture_sensors_availability_notification
  # После запуска системы (время работы системы - настройка таймаута датчиков > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Moisture sensors availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.moisture_sensors_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Moisture sensors availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int -
          states('input_number.moisture_sensors_availability_timeout_minutes') | int
          ) > 0 
      }}
    enabled: true
actions:
  - choose:
      # Если количество недоступных датчиков менее трех, то отправляем уведомление со списком датчиков
      - conditions:
          - condition: numeric_state
            entity_id: number.moisture_sensors_unavailable_count
            above: 0
            below: 3
        sequence:
          - variables:
              unavailable_moisture_sensors: >
                {%
                set unavailable_filtered_moisture_sensors = 
                expand(label_entities("moisture") |
                select('match', '.*_availability$')) |
                selectattr('state', '!=', 'on') | 
                map(attribute='entity_id') | list 
                %}

                {% set ns = namespace(device_names=[]) %}

                {% for moisture_sensor in unavailable_filtered_moisture_sensors %}
                  {% set moisture_sensor_device_id = device_id(moisture_sensor) %}
                  {% if moisture_sensor_device_id %}
                    {% set area_id = device_attr(moisture_sensor_device_id, 'area_id') %}
                    {% set area_name = area_name(area_id) if area_id else "Без комнаты" %}
                
                    {% set moisture_sensor_name = 
                      device_attr(moisture_sensor_device_id, 'name_by_user') or device_attr(moisture_sensor_device_id, 'name') %}
                
                    {% set ns.device_names = ns.device_names + [moisture_sensor_name ~ " (" ~ area_name ~")"] %}
                  {% endif %}
                {% endfor %}

                {{ ns.device_names | join("\n") }}
          - action: script.universal_notification_sender
            metadata: { }
            data:
              automation_trigger_id: "{{ trigger.id }}"
              message_text: "{{ unavailable_moisture_sensors }}"
              message_title: Датчики протечки недоступны!
              message_notification_id: moisture_sensors_availability_notification
      # Если количество недоступных датчиков более двух, то отправляем уведомление с общим количеством недоступных датчиков
      - conditions:
          - condition: numeric_state
            entity_id: number.moisture_sensors_unavailable_count
            above: 2
        sequence:
          - action: script.universal_notification_sender
            metadata: { }
            data:
              message_text: >-
                Доступно датчиков протечки {{ states("number.moisture_sensors_available_count") | int | string
                + "/" + states('input_number.moisture_sensors_expected_count') | int | string }}
              message_title: Датчики протечки недоступны!
              message_notification_id: moisture_sensors_availability_notification
              automation_trigger_id: "{{ trigger.id }}"
mode: single
