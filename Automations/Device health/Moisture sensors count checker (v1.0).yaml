# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - moisture_sensors_count_checker
# dependencies:
#   - Moisture sensors availability timeout minutes (Helper)
#   - Moisture sensors expected count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Moisture sensors count checker (v1.0)
description: >-
  **Что делает:**
  Проверяет, что необходимым датчикам и сенсорам протечки проставлен лейбл *moisture*.

  **Как приходит оповещение:**
  - Проверяет лейблы у датчиков четырёх типов: доступность, уровень батареи, статус низкого заряда батареи, сигнал протечки.
  - Для каждого типа сравнивает фактическое число с ожидаемым.
  - При расхождении отправляет отдельное уведомление, где указано, сколько датчиков есть сейчас и сколько должно быть (например, «2/3»).

  **Когда срабатывает проверка:**
  - 📅 Каждое утро в 08:00.
  - ✏️ Когда вы меняете ожидаемое количество датчиков (настройка `Moisture sensors expected count`).
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы датчики успели проснуться).
  - 🔔 Когда вы закрываете любое из уведомлений о несовпадении — автоматизация сразу перепроверяет, не устранена ли проблема.

  **Настройки:**
  - `Moisture sensors expected count` — сколько всего датчиков протечки должно быть в доме.
  - `Moisture sensors availability timeout minutes` — через сколько минут без ответа датчик считается недоступным (влияет только на задержку запуска проверки после перезагрузки).
triggers:
  # Когда меняется настройка ожидаемого количества датчиков в доме
  - trigger: state
    entity_id:
      - input_number.moisture_sensors_expected_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления о несоответствии числа датчиков доступности
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: moisture_sensors_availability_count_problem_notification
    id: persistent_notification_removed
  # При удалении уведомления о несоответствии числа датчиков с батареями
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: moisture_sensors_battery_count_problem_notification
    id: persistent_notification_removed
  # При удалении уведомления о несоответствии числа датчиков с состоянием батарей
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: moisture_sensors_battery_state_count_problem_notification
    id: persistent_notification_removed
  # При удалении уведомления о несоответствии числа датчиков протечки
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: moisture_sensors_leak_count_problem_notification
    id: persistent_notification_removed
  # После запуска системы (время работы системы - настройка таймаута датчиков > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Moisture sensors availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.moisture_sensors_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Moisture sensors availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int -
          states('input_number.moisture_sensors_availability_timeout_minutes') | int
          ) > 0 
      }}
    enabled: true
actions:
  # Вычисляем количество датчиков доступности с лейблом moisture
  - variables:
      moisture_sensors_labeled_availability_current_count: >
        {{ label_entities("moisture") | select('match', '.*_availability$') |
        list | count }}
  # Вычисляем количество датчиков батарей с лейблом moisture
  - variables:
      moisture_sensors_labeled_battery_current_count: >
        {{ label_entities("moisture") | select('match', '.*_battery$') | 
        list | count }}
  # Вычисляем количество датчиков состояния батарей с лейблом moisture
  - variables:
      moisture_sensors_labeled_battery_state_current_count: >
        {{ label_entities("moisture") | select('match', '.*_battery_low$') |
        list | count }}
  # Вычисляем количество датчиков протечки с лейблом moisture
  - variables:
      moisture_sensors_labeled_water_leak_current_count: >
        {{ label_entities("moisture") | select('match', '.*_water_leak$') |
        list | count }}
  # Если вычисленное количество датчиков доступности с лейблом moisture не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством  
  - if:
      - condition: template
        value_template: >-
          {{ moisture_sensors_labeled_availability_current_count | int !=
          states('input_number.moisture_sensors_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество датчиков протечки не совпадает
          message_text: >-
            Фактическое количество датчиков протечки (доступность) не совпадает
            с ожидаемым ({{ moisture_sensors_labeled_availability_current_count }}/
            {{ states('input_number.moisture_sensors_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: moisture_sensors_availability_count_problem_notification
  # Если вычисленное количество датчиков батарей с лейблом moisture не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ moisture_sensors_labeled_battery_current_count | int !=
          states('input_number.moisture_sensors_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество датчиков протечки не совпадает
          message_text: >-
            Фактическое количество датчиков протечки (батарея проценты) не совпадает
            с ожидаемым ({{ moisture_sensors_labeled_battery_current_count }}/
            {{ states('input_number.moisture_sensors_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: moisture_sensors_battery_count_problem_notification
  # Если вычисленное количество датчиков статуса батарей с лейблом moisture не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ moisture_sensors_labeled_battery_state_current_count | int !=
          states('input_number.moisture_sensors_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество датчиков протечки не совпадает
          message_text: >-
            Фактическое количество датчиков протечки (батарея статус) не совпадает
            с ожидаемым ({{ moisture_sensors_labeled_battery_state_current_count }}/
            {{ states('input_number.moisture_sensors_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: moisture_sensors_battery_state_count_problem_notification
  # Если вычисленное количество датчиков протечки с лейблом moisture не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ moisture_sensors_labeled_water_leak_current_count | int !=
          states('input_number.moisture_sensors_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество датчиков протечки не совпадает
          message_text: >-
            Фактическое количество датчиков протечки (протечка) не совпадает
            с ожидаемым ({{ moisture_sensors_labeled_water_leak_current_count }}/
            {{ states('input_number.moisture_sensors_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: moisture_sensors_leak_count_problem_notification
mode: single
