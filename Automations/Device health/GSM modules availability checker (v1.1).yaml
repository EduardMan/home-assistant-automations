# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - gsm_modules_availability_checker
# dependencies:
#   - GSM modules availability timeout minutes (Helper)
#   - GSM modules unavailable count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: GSM modules availability checker (v1.1)
description: |2-
  **Что делает:**  
  Проверяет доступность GSM-модулей (например, TTGO T-Call).  
  Если модуль не обновляет RSSI дольше заданного таймаута — приходит уведомление.

  **Как приходит оповещение:**  
  - Если недоступны 1–5 модулей — в сообщении перечислены их названия и комнаты.  
  - Если больше 5 — выводятся первые 5, а затем общее количество оставшихся.

  **Когда срабатывает проверка:**  
  - 📅 Каждое утро в 08:00  
  - ⚙️ Когда меняется таймаут или счётчик недоступных  
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы модули успели проснуться)  
  - 🔔 Сразу после закрытия уведомления о недоступности (чтобы перепроверить, не появились ли новые проблемы)

  **Настройки:**  
  - `GSM module availability timeout minutes` — через сколько минут отсутствия обновлений RSSI модуль считается недоступным.

  **Сенсоры:**  
  - `GSM modules unavailable count` — текущее число недоступных модулей.
triggers:
  # Когда меняется настройка таймаута доступности GSM модулей
  - trigger: state
    entity_id:
      - input_number.gsm_modules_availability_timeout_minutes
  # Когда меняется количество недоступных GSM модулей
  - trigger: state
    entity_id:
      - number.gsm_modules_unavailable_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления недоступности GSM модулей
  - trigger: persistent_notification
    update_type:
      - removed
    id: persistent_notification_removed
    notification_id: gsm_modules_availability_notification
  # После запуска системы (время работы системы - настройка таймаута GSM модулей > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than GSM modules availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.gsm_modules_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater than GSM modules availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.gsm_modules_availability_timeout_minutes') | int
          ) > 0 
      }}
actions:
  - variables:
      unavailable_gsm_modules: >
        {% set limit = 5 %}
        {% set issues = namespace(total=0, list=[]) %}
        
        {%
        set unavailable_filtered_gsm_modules = 
        expand(label_entities("gsm") |
        select('match', '.*_availability$')) |
        selectattr('state', '!=', 'on') | 
        map(attribute='entity_id') | list 
        %}
        
        {% for gsm_module in unavailable_filtered_gsm_modules %}
          {% set gsm_module_device_id = device_id(gsm_module) %}
          {% if gsm_module_device_id %}
            {% set area_id = device_attr(gsm_module_device_id, 'area_id') %}
            
            {% set area_name = area_name(area_id) if area_id else "Без комнаты" %}
            {% set gsm_module_name = 
              device_attr(gsm_module_device_id, 'name_by_user') or device_attr(gsm_module_device_id, 'name') %}
        
            {% set issues.total = issues.total + 1 %}
            {% set issues.list = issues.list + [gsm_module_name + " (" + area_name + ")"] %}
        
          {% endif %}
        {% endfor %}
        
        {% if issues.total > limit %}
            {{ issues.list[:limit] | join('\n') ~ '\n... и ещё ' ~ (issues.total - limit) ~ ' модуля(ей)' }}
        {% else %}
            {{ issues.list | join('\n') }}
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ unavailable_gsm_modules != '' }}"
        alias: If unavailable_gsm_modules is not empty
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          automation_trigger_id: "{{ trigger.id }}"
          message_text: "{{ unavailable_gsm_modules }}"
          message_title: GSM модули недоступны более {{ states('input_number.gsm_modules_availability_timeout_minutes') | int }} минут!
          message_notification_id: gsm_modules_availability_notification
mode: single
