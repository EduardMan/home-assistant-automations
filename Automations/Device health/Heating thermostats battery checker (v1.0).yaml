# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - heating_thermostats_battery_checker
# dependencies:
#   - Heating thermostats availability timeout minutes (Helper)
#   - Heating thermostats battery threshold (Helper)
#   - Heating thermostats discharged count (Helper)
#   - Heating thermostats expected count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Heating thermostats battery checker (v1.0)
description: |2-
  **Что делает:**
  Проверяет, нет ли в доме термостатов отопления с низким зарядом батареи.
  Если заряд какого-то термостата опускается ниже заданного порога — приходит уведомление.

  **Как приходит оповещение:**
  - Если разряженных термостатов 1–2 — в сообщении перечислены их названия, текущий процент заряда и комната.
  - Если 3 или больше — показывается только общее количество разряженных термостатов (например, «3 из 5 термостатов отопления имеют низкий заряд»).

  **Когда срабатывает проверка:**
  - 📅 Каждое утро в 08:00.
  - ⚙️ Когда меняется количество разряженных термостатов (счётчик `Heating thermostats discharged count`).
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы термостаты успели проснуться).
  - 🔔 Сразу после того, как вы закрыли уведомление о низком заряде (чтобы перепроверить, не появились ли новые разряженные).

  **Настройки:**
  - `Heating thermostats battery threshold` — порог заряда в процентах, ниже которого термостат считается разряженным.
  - `Heating thermostats expected count` — сколько всего термостатов должно быть в доме.
  - `Heating thermostats availability timeout minutes` — через сколько минут без ответа термостат считается недоступным (влияет только на задержку проверки после перезагрузки).

  **Сенсоры:**
  - `Heating thermostats discharged count` — текущее число термостатов с низким зарядом батареи (обновляется автоматически).
triggers:
  # Когда меняется количество разряженных термостатов
  - trigger: state
    entity_id:
      - number.heating_thermostats_discharged_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления о разряженности термостатов
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: heating_thermostats_discharged_notification
    id: persistent_notification_removed
  # После запуска системы (время работы системы - настройка таймаута термостатов > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Heating thermostats availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.heating_thermostats_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Heating thermostats availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int -
          states('input_number.heating_thermostats_availability_timeout_minutes') | int
          ) > 0 
      }}
    enabled: true
actions:
  - choose:
      # Если количество разряженных термостатов менее трех, то отправляем уведомление со списком термостатов
      - conditions:
          - condition: numeric_state
            entity_id: number.heating_thermostats_discharged_count
            above: 0
            below: 3
        sequence:
          - variables:
              discharged_heating_thermostats: >
                {% set battery_threshold = states('input_number.heating_thermostats_battery_threshold') | float %}

                {% set entities = expand(label_entities("heating_thermostat") | select('match', '.*_battery$')) | list %}

                {# Список термостатов у которых уровень заряда ниже настроенного порога #}
                {% set filtered_threshold_entities = namespace(filtered_entities=[]) %} 
                {% for entity_for_filter in entities %}
                  {% if entity_for_filter.state | float < battery_threshold %}
                    {% set filtered_threshold_entities.filtered_entities = filtered_threshold_entities.filtered_entities + [entity_for_filter] %}
                  {% endif %}
                {% endfor %}

                {% set ns = namespace(device_names=[]) %}

                {% for entity in filtered_threshold_entities.filtered_entities %}
                  {% set dev = device_id(entity.entity_id) %}
                  {% if dev %}
                    {% set area_id = device_attr(dev, 'area_id') %}
                    {% set area = area_name(area_id) if area_id else "Без комнаты" %}

                    {% set name = device_attr(dev, 'name_by_user') or device_attr(dev, 'name') %}
                    {% set ns.device_names = ns.device_names + [name ~ " (" ~ entity.state ~ "%) - " ~ area] %}
                  {% endif %}
                {% endfor %}

                {{ ns.device_names | join("\n") }}
          - action: script.universal_notification_sender
            metadata: { }
            data:
              automation_trigger_id: "{{ trigger.id }}"
              message_text: "{{ discharged_heating_thermostats }}"
              message_title: Низкий заряд в термостатах отопления!
              message_notification_id: heating_thermostats_discharged_notification
      # Если количество разряженных термостатов более двух, то отправляем уведомление с общим количеством разряженных термостатов
      - conditions:
          - condition: numeric_state
            entity_id: number.heating_thermostats_discharged_count
            above: 2
        sequence:
          - action: script.universal_notification_sender
            metadata: { }
            data:
              message_text: >-
                В {{ states('number.heating_thermostats_discharged_count') }} 
                термостатов отопления из {{ states('input_number.heating_thermostats_expected_count') }}
                низкий заряд батареи
              message_title: Низкий заряд в термостатах отопления!
              message_notification_id: heating_thermostats_discharged_notification
              automation_trigger_id: "{{ trigger.id }}"
mode: single
