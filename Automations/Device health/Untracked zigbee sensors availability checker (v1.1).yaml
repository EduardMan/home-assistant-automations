# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - untracked_zigbee_sensors_availability_checker
# dependencies:
#   - Untracked zigbee sensors availability timeout minutes (Helper)
#   - Untracked zigbee sensors unavailable count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Untracked zigbee sensors availability checker (v1.1)
description: |2-
  **Что делает:**  
  Проверяет доступность ZigBee-устройств, у которых нет специализированной автоматизации.  
  Если датчик не обновлялся дольше заданного таймаута — приходит уведомление со списком устройств и комнат.

  **Как приходит оповещение:**  
  - Перечисляются устройства, пропавшие из сети, с указанием комнаты.  
  - Если проблем больше 5, выводятся первые 5, а затем общее число оставшихся.

  **Когда срабатывает проверка:**  
  - 📅 Каждое утро в 08:00
  - ⚙️ Когда меняется таймаут или счётчик недоступных
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы датчики успели проснуться).
  - 🔔 Сразу после закрытия уведомления о недоступности (чтобы перепроверить, не появились ли новые проблемы).

  **Настройки:**  
  - `Untracked zigbee sensors availability timeout minutes` — таймаут, после которого датчик считается недоступным.
  
  **Сенсоры:**
  - `Untracked zigbee sensors unavailable count` — текущее число устройств, которые не на связи.
triggers:
  # Когда меняется настройка таймаута доступности неотслеживаемых ZigBee устройств
  - trigger: state
    entity_id:
      - input_number.untracked_zigbee_sensors_availability_timeout_minutes
  # Когда меняется количество недоступных устройств
  - trigger: state
    entity_id:
      - number.untracked_zigbee_sensors_unavailable_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления недоступности устройств
  - trigger: persistent_notification
    update_type:
      - removed
    id: persistent_notification_removed
    notification_id: untracked_zigbee_sensors_availability_notification
  # После запуска системы (время работы системы - настройка таймаута устройств > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Untracked zigbee sensors availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.untracked_zigbee_sensors_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Untracked zigbee sensors availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int -
          states('input_number.untracked_zigbee_sensors_availability_timeout_minutes') | int
          ) > 0 
      }}
    enabled: true
actions:
  - variables:
      unavailable_untracked_zigbee_sensors: |
        {% set limit = 5 %}
        {# find all entities ends with _last_seen #}
        {% set all_last_seen_entities = states.sensor
            | selectattr('entity_id', 'match', '.*_last_seen$')
            | list %}

        {# Define devices labels which already tracked by automations =>
            they don't need to check in this helper #}
        {% set excluded_labels = [
            'door',
            'moisture',
            'motion',
            'temperature',
            'smoke',
            'moisture_valve',
            ] %}

        {% set issues = namespace(total=0, list=[]) %}
        {% set atm = 'input_number.untracked_zigbee_sensors_availability_timeout_minutes' %}

        {% for last_seen_entity in all_last_seen_entities %}
        {% set dev = device_id(last_seen_entity.entity_id) %}

        {# Check that device is zigbee and works via zigbee2mqtt_,
            because we don't need to catch unwanted devices - this can lead to unpredictable behavior #}
        {# device_attr(dev, 'identifiers') - this is tuple, i.e. [('mqtt', 'zigbee2mqtt_0x00158d0004519235')] #}
        {% if 'zigbee2mqtt_' in device_attr(dev, 'identifiers') | string %}
            {% set all_entity_labels = device_entities(dev) | map('labels') | sum(start=[]) | unique | list %}
            {% if all_entity_labels | select('in', excluded_labels) | list | count == 0 %}
                {% set last_seen_val = states(last_seen_entity.entity_id) %}
                {% if last_seen_val in ['unknown', 'unavailable'] 
                    or (as_timestamp(now()) - as_timestamp(last_seen_val)) | int / 60 >= (states(atm) | int) %}
                    
                    {% set issues.total = issues.total + 1 %}

                    {% set area_id = device_attr(last_seen_entity.entity_id, 'area_id') %}
                    {% set area = area_name(area_id) if area_id else "Без комнаты" %}
                    {% set issues.list = issues.list + [device_name(last_seen_entity.entity_id) + " (" + area + ")"] %}
                {% endif %}
            {% endif %}
        {% endif %}
        {% endfor %}

        {% if issues.total > limit %}
            {{ issues.list[:limit] | join('\n') ~ '\n... и ещё ' ~ (issues.total - limit) ~ ' датчик(а)' }}
        {% else %}
            {{ issues.list | join('\n') }}
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ unavailable_untracked_zigbee_sensors != '' }}"
        alias: If unavailable_untracked_zigbee_sensors is not empty
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          automation_trigger_id: "{{ trigger.id }}"
          message_text: "{{ unavailable_untracked_zigbee_sensors }}"
          message_title: ZigBee устройства недоступны более {{ states('input_number.untracked_zigbee_sensors_availability_timeout_minutes') | int }} минут!
          message_notification_id: untracked_zigbee_sensors_availability_notification
mode: single
