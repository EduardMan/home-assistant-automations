# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - untracked_zigbee_sensors_battery_checker
# dependencies:
#   - Untracked zigbee sensors availability timeout minutes (Helper)
#   - Untracked zigbee sensors battery threshold (Helper)
#   - Untracked zigbee sensors discharged count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Untracked zigbee sensors battery checker (v1.2)
description: |2-
  **Что делает:**  
  Проверяет, нет ли неотслеживаемых ZigBee устройств с низким зарядом батареи.  
  Если заряд какого-то устройства опускается ниже заданного порога — приходит уведомление.

  **Как приходит оповещение:**  
  - Если разряженных устройств 1–5 — в сообщении перечислены их названия, текущий процент заряда и комната.  
  - Если больше 5 — показаны первые пять, а затем общее количество оставшихся.

  **Когда срабатывает проверка:**  
  - 📅 Каждое утро в 08:00  
  - ⚙️ Когда меняется количество разряженных устройств (счётчик `Untracked zigbee sensors discharged count`)  
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы устройства успели проснуться)  
  - 🔔 Сразу после того, как вы закрыли уведомление о низком заряде (чтобы перепроверить, не появились ли новые разряженные)

  **Настройки:**  
  - `Untracked zigbee sensors battery threshold` — порог заряда в процентах, ниже которого устройство считается разряженным.  
  - `Untracked zigbee sensors availability timeout minutes` — через сколько минут без ответа устройство считается недоступным (влияет только на задержку проверки после перезагрузки).

  **Сенсоры:**  
  - `Untracked zigbee sensors discharged count` — текущее число неотслеживаемых устройств с низким зарядом батареи (обновляется автоматически).
triggers:
  # Когда меняется количество разряженных датчиков
  - trigger: state
    entity_id:
      - number.untracked_zigbee_sensors_discharged_count
    enabled: true
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления о разряженности датчиков
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: untracked_zigbee_sensors_discharged_notification
    id: persistent_notification_removed
  # После запуска системы (время работы системы - настройка таймаута датчиков > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Untracked zigbee sensors availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.untracked_zigbee_sensors_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Untracked zigbee sensors availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int -
          states('input_number.untracked_zigbee_sensors_availability_timeout_minutes') | int
          ) > 0 
      }}
    enabled: true
actions:
  - variables:
      discharged_untracked_zigbee_sensors: >
        {% set limit = 5 %}
        {% set battery_threshold =
        states('input_number.untracked_zigbee_sensors_battery_threshold') | float %}
        
        {# Define devices labels which already tracked by automations =>
            they don't need to check in this helper #}
        {% set excluded_labels = [
            'door',
            'moisture',
            'motion',
            'temperature',
            'smoke',
            'moisture_valve',
            ] %}
        
        {% set issues = namespace(total=0, list=[]) %}
        
        {# Get all mqtt integration entities (except labeled by excluded_labels) #}
        {% set entities = integration_entities('mqtt')
          | select('match', '.*_battery$')
          | reject('in', excluded_labels
          | map('label_entities')
          | sum(start=[])
          | unique
          | list) 
          | list %}
        
        {% for entity in entities %}
          {% if states(entity) | float < battery_threshold %}
            {% set issues.total = issues.total + 1 %}
            
            {% set area_id = device_attr(entity, 'area_id') %}
            {% set area = area_name(area_id) if area_id else "Без комнаты" %}
            {% set issues.list = issues.list + [device_name(entity) + " (" + area + ")" + " - " + states(entity) + "%" ] %}
          {% endif %}
        {% endfor %}
        
        {% if issues.total > limit %}
          {{ issues.list[:limit] | join('\n') ~ '\n... и ещё ' ~ (issues.total - limit) ~ ' датчик(а)' }}
        {% else %}
          {{ issues.list | join('\n') }}
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ discharged_untracked_zigbee_sensors != '' }}"
        alias: If discharged_untracked_zigbee_sensors is not empty
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          automation_trigger_id: "{{ trigger.id }}"
          message_text: "{{ discharged_untracked_zigbee_sensors }}"
          message_title: Низкий заряд в неотслеживаемых ZigBee устройствах!
          message_notification_id: untracked_zigbee_sensors_discharged_notification
mode: single
