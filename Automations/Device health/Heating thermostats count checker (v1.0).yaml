# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - heating_thermostats_count_checker
# dependencies:
#   - Heating thermostats availability timeout minutes (Helper)
#   - Heating thermostats expected count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Heating thermostats count checker (v1.0)
description: |2-
  **Что делает:**
  Проверяет, что необходимым датчикам и сенсорам термостатов отопления проставлен лейбл *heating_thermostat*.

  **Как приходит оповещение:**
  - Проверяет лейблы у датчиков трёх типов: доступность, уровень батареи, состояние контакта.
  - Для каждого типа сравнивает фактическое число с ожидаемым.
  - При расхождении отправляет отдельное уведомление, где указано, сколько датчиков есть сейчас и сколько должно быть (например, «2/3»).

  **Когда срабатывает проверка:**
  - 📅 Каждое утро в 08:00.
  - ✏️ Когда вы меняете ожидаемое количество датчиков (настройка `Heating thermostats expected count`).
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы датчики успели проснуться).
  - 🔔 Когда вы закрываете любое из уведомлений о несовпадении — автоматизация сразу перепроверяет, не устранена ли проблема.

  **Настройки:**
  - `Heating thermostats expected count` — сколько всего термостатов отопления должно быть в доме.
  - `Heating thermostats availability timeout minutes` — через сколько минут без ответа датчик считается недоступным (влияет только на задержку запуска проверки после перезагрузки).
triggers:
  # Когда меняется настройка ожидаемого количества датчиков в доме
  - trigger: state
    entity_id:
      - input_number.heating_thermostats_expected_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления о несоответствии числа датчиков доступности
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: heating_thermostats_availability_count_problem_notification
    id: persistent_notification_removed
  # При удалении уведомления о несоответствии числа датчиков с батареями
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: heating_thermostats_battery_count_problem_notification
    id: persistent_notification_removed
  # При удалении уведомления о несоответствии числа датчиков локальной температуры
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: heating_thermostats_local_temperature_count_problem_notification
    id: persistent_notification_removed
  # После запуска системы (время работы системы - настройка таймаута датчиков > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Heating thermostats availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.heating_thermostats_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Heating thermostats availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int -
          states('input_number.heating_thermostats_availability_timeout_minutes') | int
          ) > 0 
      }}
    enabled: true
actions:
  # Вычисляем количество датчиков доступности с лейблом heating_thermostat
  - variables:
      heating_thermostats_labeled_availability_current_count: >
        {{ label_entities("heating_thermostat") | select('match', '.*_availability$') | 
        list | count }}
  # Вычисляем количество датчиков батарей с лейблом heating_thermostat
  - variables:
      heating_thermostats_labeled_battery_current_count: >
        {{ label_entities("heating_thermostat") | select('match', '.*_battery$') | 
        list | count }}
  # Вычисляем количество датчиков локальной температуры с лейблом heating_thermostat
  - variables:
      heating_thermostats_labeled_local_temperature_current_count: >
        {{ label_entities("heating_thermostat") | select('match', '.*_radiator_local_temperature$') | 
        list | count }}
  # Если вычисленное количество датчиков доступности с лейблом heating_thermostat не совпадает с настройкой ожидаемого количества термостатов в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ heating_thermostats_labeled_availability_current_count | int !=
          states('input_number.heating_thermostats_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество термостатов отопления не совпадает
          message_text: >-
            Фактическое количество термостатов отопления (доступность) не совпадает с
            ожидаемым ({{ heating_thermostats_labeled_availability_current_count }}/
            {{ states('input_number.heating_thermostats_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: heating_thermostats_availability_count_problem_notification
  # Если вычисленное количество датчиков батарей с лейблом heating_thermostat не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ heating_thermostats_labeled_battery_current_count | int !=
          states('input_number.heating_thermostats_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество термостатов отопления не совпадает
          message_text: >-
            Фактическое количество термостатов отопления (батарея) не совпадает с
            ожидаемым ({{ heating_thermostats_labeled_battery_current_count }}/
            {{ states('input_number.heating_thermostats_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: heating_thermostats_battery_count_problem_notification
  # Если вычисленное количество датчиков локальной температуры с лейблом heating_thermostat не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ heating_thermostats_labeled_local_temperature_current_count | int !=
          states('input_number.heating_thermostats_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество термостатов отопления не совпадает
          message_text: >-
            Фактическое количество термостатов отопления (локальная температура) не совпадает 
            с ожидаемым ({{ heating_thermostats_labeled_local_temperature_current_count }}/
            {{ states('input_number.heating_thermostats_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: heating_thermostats_local_temperature_count_problem_notification
mode: single
