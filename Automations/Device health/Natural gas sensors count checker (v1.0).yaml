# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - natural_gas_sensors_count_checker
# dependencies:
#   - Natural gas sensors expected count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Natural gas sensors count checker (v1.0)
description: >-
  **Что делает:**
  Проверяет, что все датчики утечки газа имеют нужную метку и их количество совпадает с ожидаемым.

  **Как приходит оповещение:**
  - Подсчитывает датчики с лейблом *natural gas* и типом «доступность».
  - Сравнивает фактическое число с ожидаемым.
  - При расхождении отправляет уведомление, где указано, сколько датчиков есть сейчас и сколько должно быть (например, «2/3»).

  **Когда срабатывает проверка:**
  - 📅 Каждое утро в 08:00.
  - ✏️ Когда вы меняете ожидаемое количество датчиков (настройка `Natural gas sensors expected count`).
  - 🔄 Через несколько минут после запуска системы (чтобы датчики успели подключиться).
  - 🔔 Когда вы закрываете уведомление о несовпадении — автоматизация сразу перепроверяет, не устранена ли проблема.

  **Настройки:**
  - `Natural gas sensors expected count` — сколько всего датчиков утечки газа должно быть в доме.
triggers:
  # Когда меняется настройка ожидаемого количества датчиков в доме
  - trigger: state
    entity_id:
      - input_number.natural_gas_sensors_expected_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления о несоответствии числа датчиков доступности
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: natural_gas_sensors_availability_count_problem_notification
    id: persistent_notification_removed
  # Через 5 минут после запуска системы
  - alias: After 5 min start up
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int
          ) > 5 
      }}
conditions:
  - alias: System operation time greater then 3 min
    condition: template
    value_template: >-
      {{
        (
         ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int
         ) > 3 
      }}
actions:
  # Вычисляем количество датчиков доступности с лейблом natural gas
  - variables:
      natural_gas_sensors_labeled_availability_current_count: >
        {{ label_entities("natural gas") | select('match', '.*_availability$') |
        list | count }}
  # Если вычисленное количество датчиков доступности с лейблом natural gas не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ natural_gas_sensors_labeled_availability_current_count | int !=
          states('input_number.natural_gas_sensors_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество датчиков утечки газа не совпадает
          message_text: >-
            Фактическое количество датчиков утечки газа (доступность) не совпадает
            с ожидаемым ({{ natural_gas_sensors_labeled_availability_current_count }}/
            {{ states('input_number.natural_gas_sensors_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: natural_gas_sensors_availability_count_problem_notification
mode: single
