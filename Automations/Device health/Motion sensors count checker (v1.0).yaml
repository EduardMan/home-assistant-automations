# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - motion_sensors_count_checker
# dependencies:
#   - Motion sensors availability timeout minutes (Helper)
#   - Motion sensors expected count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Motion sensors count checker (v1.0)
description: >-
  **Что делает:**
  Проверяет, что необходимым датчикам и сенсорам движения проставлен лейбл *motion*.
  
  **Как приходит оповещение:**
  - Проверяет лейблы у датчиков трёх типов: доступность, уровень батареи, присутствие.
  - Для каждого типа сравнивает фактическое число с ожидаемым.
  - При расхождении отправляет отдельное уведомление, где указано, сколько датчиков есть сейчас и сколько должно быть (например, «2/3»).

  **Когда срабатывает проверка:**
  - 📅 Каждое утро в 08:00.
  - ✏️ Когда вы меняете ожидаемое количество датчиков (настройка `Motion sensors expected count`).
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы датчики успели проснуться).
  - 🔔 Когда вы закрываете любое из уведомлений о несовпадении — автоматизация сразу перепроверяет, не устранена ли проблема.

  **Настройки:**
  - `Motion sensors expected count` — сколько всего датчиков движения должно быть в доме.
  - `Motion sensors availability timeout minutes` — через сколько минут без ответа датчик считается недоступным (влияет только на задержку проверки после перезагрузки).
triggers:
  # Когда меняется настройка ожидаемого количества датчиков в доме
  - trigger: state
    entity_id:
      - input_number.motion_sensors_expected_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления о несоответствии числа датчиков доступности
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: motion_sensors_availability_count_problem_notification
    id: persistent_notification_removed
  # При удалении уведомления о несоответствии числа датчиков с батареями
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: motion_sensors_battery_count_problem_notification
    id: persistent_notification_removed
  # При удалении уведомления о несоответствии числа датчиков движения
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: motion_sensors_occupancy_count_problem_notification
    id: persistent_notification_removed
  # После запуска системы (время работы системы - настройка таймаута датчиков > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Motion sensors availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.motion_sensors_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Motion sensors availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int -
          states('input_number.motion_sensors_availability_timeout_minutes') | int
          ) > 0 
      }}
    enabled: true
actions:
  # Вычисляем количество датчиков доступности с лейблом motion
  - variables:
      motion_sensors_labeled_availability_current_count: >
        {{ label_entities("motion") | select('match', '.*_availability$') | 
        list | count }}
  # Вычисляем количество датчиков батарей с лейблом motion
  - variables:
      motion_sensors_labeled_battery_current_count: >
        {{ label_entities("motion") | select('match', '.*_battery$') | 
        list | count }}
  # Вычисляем количество датчиков присутствия с лейблом motion
  - variables:
      motion_sensors_labeled_occupancy_current_count: >
        {{ label_entities("motion") | select('match', '.*_occupancy$') |
        list | count }}
  # Если вычисленное количество датчиков доступности с лейблом motion не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ motion_sensors_labeled_availability_current_count | int !=
          states('input_number.motion_sensors_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество датчиков движения не совпадает
          message_text: >-
            Фактическое количество датчиков движения (доступность) не совпадает с
            ожидаемым ({{ motion_sensors_labeled_availability_current_count }}/
            {{ states('input_number.motion_sensors_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: motion_sensors_availability_count_problem_notification
  # Если вычисленное количество датчиков батарей с лейблом motion не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ motion_sensors_labeled_battery_current_count | int !=
          states('input_number.motion_sensors_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество датчиков движения не совпадает
          message_text: >-
            Фактическое количество датчиков движения (батарея) не совпадает с
            ожидаемым ({{ motion_sensors_labeled_battery_current_count }}/{{
            states('input_number.motion_sensors_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: motion_sensors_battery_count_problem_notification
  # Если вычисленное количество датчиков движения с лейблом motion не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ motion_sensors_labeled_occupancy_current_count | int !=
          states('input_number.motion_sensors_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество датчиков движения не совпадает
          message_text: >-
            Фактическое количество датчиков движения (занятость) не совпадает
            с ожидаемым ({{ motion_sensors_labeled_occupancy_current_count }}/
            {{ states('input_number.motion_sensors_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: motion_sensors_occupancy_count_problem_notification
mode: single
