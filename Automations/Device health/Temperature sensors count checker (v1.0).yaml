# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - temperature_sensors_count_checker
# dependencies:
#   - Temperature sensors availability timeout minutes (Helper)
#   - Temperature sensors expected count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Temperature sensors count checker (v1.0)
description: |2-
  **Что делает:**
  Проверяет, что необходимым датчикам и сенсорам температуры проставлен лейбл *temperature*.
  
  **Как приходит оповещение:**
  - Проверяет лейблы у датчиков трёх типов: доступность, уровень батареи, значение температуры.
  - Для каждого типа сравнивает фактическое число с ожидаемым.
  - При расхождении отправляет отдельное уведомление, где указано, сколько датчиков есть сейчас и сколько должно быть (например, «2/3»).
  
  **Когда срабатывает проверка:**
  - 📅 Каждое утро в 08:00.
  - ✏️ Когда вы меняете ожидаемое количество датчиков (настройка `Temperature sensors expected count`).
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы датчики успели проснуться).
  - 🔔 Когда вы закрываете любое из уведомлений о несовпадении — автоматизация сразу перепроверяет, не устранена ли проблема.
  
    **Настройки:**
  - `Temperature sensors expected count` — сколько всего датчиков температуры должно быть в доме.
  - `Temperature sensors availability timeout minutes` — через сколько минут без ответа датчик считается недоступным (влияет только на задержку проверки после перезагрузки).
triggers:
  # Когда меняется настройка ожидаемого количества датчиков в доме
  - trigger: state
    entity_id:
      - input_number.temperature_sensors_expected_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления о несоответствии числа датчиков температуры
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: temperature_sensors_availability_count_problem_notification
    id: persistent_notification_removed
  # При удалении уведомления о несоответствии числа датчиков с батареями
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: temperature_sensors_battery_count_problem_notification
    id: persistent_notification_removed
  # При удалении уведомления о несоответствии числа датчиков температуры
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: temperature_sensors_temperature_count_problem_notification
    id: persistent_notification_removed
  # После запуска системы (время работы системы - настройка таймаута датчиков > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Temperature sensors availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.temperature_sensors_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Temperature sensors availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int -
          states('input_number.temperature_sensors_availability_timeout_minutes') | int
          ) > 0 
      }}
    enabled: true
actions:
  # Вычисляем количество датчиков доступности с лейблом temperature
  - variables:
      temperature_sensors_labeled_availability_current_count: >
        {{ label_entities("temperature") | select('match', '.*_availability$') |
        list | count }}
  # Вычисляем количество датчиков батарей с лейблом temperature
  - variables:
      temperature_sensors_labeled_battery_current_count: >
        {{ label_entities("temperature") | select('match', '.*_battery$') | 
        list | count }}
  # Вычисляем количество датчиков температуры с лейблом temperature
  - variables:
      temperature_sensors_labeled_temperature_current_count: >
        {{ label_entities("temperature") | select('match', '.*_temperature$') |
        list | count }}
  # Если вычисленное количество датчиков доступности с лейблом temperature не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ temperature_sensors_labeled_availability_current_count | int !=
          states('input_number.temperature_sensors_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество датчиков температуры не совпадает
          message_text: >-
            Фактическое количество датчиков температуры (доступность) не совпадает с 
            ожидаемым ({{ temperature_sensors_labeled_availability_current_count }}/{{
            states('input_number.temperature_sensors_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: temperature_sensors_availability_count_problem_notification
  # Если вычисленное количество датчиков батарей с лейблом temperature не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ temperature_sensors_labeled_battery_current_count | int !=
          states('input_number.temperature_sensors_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество датчиков температуры не совпадает
          message_text: >-
            Фактическое количество датчиков температуры (батарея) не совпадает с
            ожидаемым ({{ temperature_sensors_labeled_battery_current_count }}/{{ 
            states('input_number.temperature_sensors_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: temperature_sensors_battery_count_problem_notification
  # Если вычисленное количество датчиков температуры с лейблом temperature не совпадает с настройкой ожидаемого количества датчиков в доме,
  # то отправляем уведомление о проблеме с количеством
  - if:
      - condition: template
        value_template: >-
          {{ temperature_sensors_labeled_temperature_current_count | int !=
          states('input_number.temperature_sensors_expected_count') | int }}
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          message_title: Количество датчиков температуры не совпадает
          message_text: >-
            Фактическое количество датчиков температуры (температура) не совпадает
            с ожидаемым ({{ temperature_sensors_labeled_temperature_current_count }}/
            {{ states('input_number.temperature_sensors_expected_count') | int }})
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: temperature_sensors_temperature_count_problem_notification
mode: single
