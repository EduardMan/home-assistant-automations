# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - moisture_valves_availability_checker
# dependencies:
#   - Moisture valves availability timeout minutes (Helper)
#   - Moisture valves unavailable count (Helper)
#   - Moisture valves available count (Helper)
#   - Moisture valves expected count (Helper)
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Moisture valves availability checker (v1.0)
description: |2-
  **Что делает:**  
  Проверяет, все ли водопроводные краны выходят на связь.  
  Если какой-то кран не отвечает дольше заданного времени — приходит уведомление.

  **Как приходит оповещение:**  
  - Если недоступны 1–2 крана — в сообщении перечислены их названия и в каких они комнатах.  
  - Если недоступны 3 или больше — показывается только общее число работающих кранов (например, 5 из 7).

  **Когда срабатывает проверка:**  
  - 📅 Каждое утро в 08:00  
  - ⚙️ Когда меняются настройки таймаута или счётчики кранов  
  - 🔄 После запуска системы (через 5 минут после того, как время работы превысит заданный таймаут — чтобы краны успели проснуться)  
  - 🔔 Сразу после того, как вы закрыли предыдущее оповещение (чтобы перепроверить, не появились ли новые проблемы)

  **Настройки:**  
  - `Moisture valves availability timeout minutes` — через сколько минут без ответа кран считается недоступным.  
  - `Moisture valves expected count` — сколько всего водопроводных кранов должно быть в системе.

  **Сенсоры:**  
  - `Moisture valves unavailable count` — текущее число кранов, которые не на связи.  
  - `Moisture valves available count` — текущее число кранов, которые на связи.
triggers:
  # Когда меняется настройка таймаута доступности водопроводных кранов
  - trigger: state
    entity_id:
      - input_number.moisture_valves_availability_timeout_minutes
  # Когда меняется количество недоступных водопроводных кранов
  - trigger: state
    entity_id:
      - number.moisture_valves_unavailable_count
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  # При удалении уведомления недоступности водопроводных кранов
  - trigger: persistent_notification
    update_type:
      - removed
    id: persistent_notification_removed
    notification_id: moisture_valves_availability_notification
  # После запуска системы (время работы системы - настройка таймаута датчиков > 5, +5 минут на всякий случай)
  - alias: >-
      When system uptime + 5 greater than Moisture valves availability timeout minutes
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.moisture_valves_availability_timeout_minutes') | int
          ) > 5 
      }}
conditions:
  - alias: System uptime is greater then Moisture valves availability timeout minutes
    condition: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int -
          states('input_number.moisture_valves_availability_timeout_minutes') | int
          ) > 0 
      }}
    enabled: true
actions:
  - choose:
      # Если количество недоступных кранов менее трех, то отправляем уведомление со списком датчиков
      - conditions:
          - condition: numeric_state
            entity_id: number.moisture_valves_unavailable_count
            above: 0
            below: 3
        sequence:
          - variables:
              unavailable_moisture_valves: >
                {%
                set unavailable_filtered_moisture_valves = 
                expand(label_entities("moisture valve") |
                select('match', '.*_availability$')) |
                selectattr('state', '!=', 'on') | 
                map(attribute='entity_id') | list 
                %}

                {% set ns = namespace(device_names=[]) %}

                {% for moisture_valve in unavailable_filtered_moisture_valves %}
                  {% set moisture_valve_device_id = device_id(moisture_valve) %}
                  {% if moisture_valve_device_id %}
                    {% set area_id = device_attr(moisture_valve_device_id, 'area_id') %}
                    {% set area_name = area_name(area_id) if area_id else "Без комнаты" %}
                
                    {% set moisture_valve_name = 
                      device_attr(moisture_valve_device_id, 'name_by_user') or device_attr(moisture_valve_device_id, 'name') %}
                
                    {% set ns.device_names = ns.device_names + [moisture_valve_name ~ " (" ~ area_name ~")"] %}
                  {% endif %}
                {% endfor %}

                {{ ns.device_names | join("\n") }}
          - action: script.universal_notification_sender
            metadata: { }
            data:
              automation_trigger_id: "{{ trigger.id }}"
              message_text: "{{ unavailable_moisture_valves }}"
              message_title: Водопроводные краны недоступны!
              message_notification_id: moisture_valves_availability_notification
      # Если количество недоступных водопроводных кранов более двух, то отправляем уведомление с общим количеством недоступных водопроводных кранов
      - conditions:
          - condition: numeric_state
            entity_id: number.moisture_valves_unavailable_count
            above: 2
        sequence:
          - action: script.universal_notification_sender
            metadata: { }
            data:
              message_text: >-
                Доступно водопроводных кранов {{ states("number.moisture_valves_available_count") | int | string
                + "/" + states('input_number.moisture_valves_expected_count') | int | string }}
              message_title: Водопроводные краны недоступны!
              message_notification_id: moisture_valves_availability_notification
              automation_trigger_id: "{{ trigger.id }}"
mode: single
