# category
#   - Safety
# labels:
#   - notification
# entityId
#   - natural_gas_sensors_threshold_exceed_detection
# dependencies:
#   - natural gas (label)
#   - Universal notification sender (Script)

alias: Natural gas sensors threshold exceed detection (v1.0)
description: |2-
  **🔧 Что делает:**  
  Следит за концентрацией природного газа и немедленно отправляет оповещение, если значение превышает заданный порог.  
  Контролирует как явно указанные сенсоры, так и все остальные сенсоры концентрации с лейблом *natural gas*, исключая дублирование.

  **⚙️ Как работает:**  
  - Основной датчик концентрации газа проверяется через `numeric_state` – уведомление приходит, как только его показания превышают порог `natural_gas_sensors_leak_detection_threshold`.  
  - Дополнительный шаблонный триггер‑ловец отслеживает **все** сенсоры с лейблом *natural gas* и суффиксом `_gas_concentration`, которые не входят в явный список. Это защита от «забытых» датчиков.  
  - Если ловец срабатывает, дополнительно отправляется техническое уведомление «Сработал ловец!» – чтобы администратор вовремя проверил автоматизацию.  
  - В сообщении указывается название устройства, комната и текущий уровень концентрации (в процентах). Если концентрацию определить не удалось, выводится «нет данных».

  **📅 Когда срабатывает:**  
  - Только при фактическом превышении порога концентрации (числовое значение).  
  - Реакция мгновенная, без задержек.

  **🛠️ Что нужно настроить:**  
  - Замените `{{ your natural gas concentration sensor }}` на реальный `entity_id` сенсора концентрации газа (например, `sensor.lumi_mcn02_5be0_gas_concentration`).  
  - Убедитесь, что числовой хелпер `input_number.natural_gas_sensors_leak_detection_threshold` создан и содержит актуальный порог.  
  - Скопируйте `entity_id` явного датчика в массив `exclude_natural_gas_concentration_sensors` внутри шаблонного триггера.  
  - Убедитесь, что скрипт `Universal notification sender` доступен и настроен.
triggers:
  # Когда указанный датчик утечки газа превышает лимит (НЕОБХОДИМО ВЫБРАТЬ ВАШИ ДАТЧИКИ УТЕЧКИ ГАЗА)
  - trigger: numeric_state
    entity_id:
      - {{ your natural gas concentration sensor }}
    above: input_number.natural_gas_sensors_leak_detection_threshold
  # Когда концентрация одного из сенсора утечки газа помеченного лейблом natural gas равна или превышает лимит
  # Данный триггер это защита, если вдруг забыли добавить сенсор утечки газа в список триггеров
  # НЕ НАДО НАДЕЯТЬСЯ И РАССЧИТЫВАТЬ НА ЭТОТ ТРИГГЕР - ЭТО "защита от дурака", ВСЕ СЕНСОРЫ УТЕЧКИ ГАЗА ДОЛЖНЫ ПРИСУТСТВОВАТЬ
  # В СПИСКЕ ТРИГГЕРОВ
  # В СКРИПТЕ ЕСТЬ МАССИВ exclude_natural_gas_sensors, который должен содержать entity_id сенсоров указанных в триггерах,
  # иначе в логах постоянно будет ошибка "Already running (only a single execution is allowed)"
  - trigger: template
    value_template: >
      {% set gas_leak_detection_threshold =
      states('input_number.natural_gas_sensors_leak_detection_threshold') %}

      {% set natural_gas_concentration_labeled_sensors = label_entities("natural_gas") 
         | select('match', '.*_gas_concentration$')
         | list %}

      {% set exclude_natural_gas_concentration_sensors = [
         'sensor.{{ your gas concentration sensor from triggers }}'
         ] %}
      
      {{ 
        expand(natural_gas_concentration_labeled_sensors)
         | selectattr('state', '>=', gas_leak_detection_threshold)
         | selectattr('state', '!=', 'unavailable')
         | map(attribute = 'entity_id')
         | reject('in', exclude_natural_gas_sensors)
         | list
         | count != 0
      }}
    alias: When labeled natural gas sensor concentration changes to on
    id: natural_gas_leak_sensors_catcher
conditions: []
actions:
  - variables:
      device_name_with_area: >
        {% set dev = device_id(trigger.entity_id) %}
        {% set area_id = device_attr(dev, 'area_id') %}
        {% set area = area_name(area_id) if area_id else "Без комнаты" %}
        {% set device_name = device_attr(dev, 'name_by_user') or device_attr(dev, 'name') %}

        {% set concentration = expand(device_entities(dev) 
          | select('match', '.*_gas_concentration$'))
          | map(attribute='state')
          | first
          | default('unknown') %}

        {{device_name ~ " (" ~ area ~ ")." ~ " Концентрация - " ~ concentration
        ~ "%"}}
  - action: script.universal_notification_sender
    metadata: {}
    data:
      automation_trigger_id: "{{ trigger.id }}"
      message_title: Превышен установленный порог концентрации газа ({{ area_name(trigger.entity_id) }})!
      message_notification_id: >-
        natural_gas_sensors_threshold_exceed_detection_notification-{{trigger.entity_id}}
      message_text: "{{ device_name_with_area }}"
  - if:
      - condition: trigger
        id:
          - natural_gas_leak_sensors_catcher
    then:
      - action: script.universal_notification_sender
        metadata: {}
        data:
          notify_if_trigger_id_is_none: false
          automation_trigger_id: "{{ trigger.id }}"
          message_notification_id: natural_gas_sensors_threshold_exceed_detection_catcher_triggered
          message_title: Сработал ловец!
          message_text: Сработал ловец утечки газа, проверьте корректность автоматизации.
mode: single
