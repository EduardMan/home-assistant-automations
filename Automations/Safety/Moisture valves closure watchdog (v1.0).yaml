# category
#   - Safety
# labels:
#   - notification
#   - scheduled
# entityId
#   - moisture_valves_closure_watchdog
# dependencies:
#   - Moisture valves last confirmed closure (Helper)
#   - Universal notification sender (Script)

alias: Moisture valves closure watchdog (v1.0)
description: |2-
  **Что делает:**
  Ежедневно проверяет, что за последние 16 дней подтверждено хотя бы одно
  успешное профилактическое перекрытие водопроводных кранов.

  **Как работает:**
  - Проверяет значение помощника Moisture valves last confirmed closure.
  - Если записи ещё нет либо прошло 16 или более суток, отправляет уведомление.
  - Запись обновляется в Moisture valves periodic exercise после ожидания полного
    хода приводов и подтверждения closed всех кранов, если перед началом хотя бы
    один кран был открыт.
  - Не считает одно лишь срабатывание триггера доказательством закрытия.
  - Проверка касается успешной профилактики, а не ручных или аварийных закрытий.

  **Когда срабатывает:**
  - 📅 Ежедневно в 08:07.

  **Настройки:**
  - Moisture valves last confirmed closure — дата и время последнего
    подтверждённого профилактического закрытия.
triggers:
  - id: scheduled
    alias: Daily valve closure age check
    note: Проверяем давность последнего подтверждённого закрытия каждый день в 08:07.
    trigger: time
    at: "08:07:00"
conditions: []
actions:
  - alias: Check whether a confirmed closure occurred in 16 days
    note: Отсутствующая или некорректная дата тоже означает, что подтверждения нет.
    if:
      - alias: No confirmed closure during the last 16 days
        condition: template
        value_template: >-
          {% set last_closure = as_timestamp(states('input_datetime.moisture_valves_last_confirmed_closure'), 0) %}
          {{ last_closure == 0 or (as_timestamp(now()) - last_closure) >= 16 * 86400 }}
    then:
      - alias: Notify missing valve closure
        action: script.universal_notification_sender
        data:
          automation_trigger_id: "{{ trigger.id }}"
          notify_if_trigger_id_is_none: true
          message_title: "Профилактика кранов: нет закрытия за 16 дней!"
          message_text: >-
            За последние 16 дней не подтверждено успешное профилактическое
            закрытие водопроводных кранов. Проверьте автоматизацию,
            состояние кранов и значение помощника последнего закрытия.
          message_notification_id: moisture_valves_closure_overdue
mode: single
