# category
#   - Safety
# labels:
#   - notification
# entityId
#   - smoke_sensors_smoke_checker
# dependencies:
#   - smoke (label)
#   - Universal notification sender (Script)

alias: Smoke sensors smoke checker (v1.0)
description: |2-
  **🔧 Что делает:**
  Периодически проверяет, нет ли в доме активного задымления.
  Если датчик всё ещё показывает тревогу — отправляет повторное оповещение.

  **Как приходит оповещение:**
  - Если активны 1–5 датчиков — в сообщении перечислены их названия и комнаты.
  - Если больше 5 — показаны первые пять, а затем общее количество оставшихся.
  - Оповещение обновляется при каждой проверке, пока датчики не вернутся в норму.

  **Когда срабатывает проверка:**
  - 📅 Каждое утро в 08:02 (дополнительный контроль).
  - 🔄 Через несколько минут после запуска системы (чтобы датчики успели обновить своё состояние).
  - 🔔 Сразу после того, как вы закрыли уведомление о задымлении — чтобы перепроверить, не осталось ли дыма.
triggers:
  - trigger: persistent_notification
    update_type:
      - removed
    id: persistent_notification_removed
  - alias: >-
      When system uptime + 5 greater than Smoke sensors availability timeout minutes
    trigger: template
    value_template: |-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.smoke_sensors_availability_timeout_minutes') | int
          ) > 5 
      }}
  - trigger: time
    at: "08:02:22"
    id: fixed_time
conditions:
  - condition: or
    conditions:
      - condition: and
        conditions:
          - condition: trigger
            id:
              - persistent_notification_removed
          - condition: template
            value_template: >-
              {{ trigger.notification.notification_id is
              match('smoke_sensors_smoke_detection_notification.*') }}
      - condition: and
        conditions:
          - condition: not
            conditions:
              - condition: trigger
                id:
                  - persistent_notification_removed
actions:
  - variables:
      device_name_with_area: |
        {% set limit = 5 %} 
        {% set issues = namespace(total=0, list=[]) %}

        {% set smoke_labeled_sensors = label_entities("smoke") 
           | select('match', '.*_smoke$')
           | list %}

        {% for smoke_labeled_sensor in smoke_labeled_sensors %}
          {% if states(smoke_labeled_sensor) == 'on' %}
            {% set issues.total = issues.total + 1 %}

            {% set area_id = device_attr(smoke_labeled_sensor, 'area_id') %}
            {% set area = area_name(area_id) if area_id else "Без комнаты" %}
            {% set issues.list = issues.list + [device_name(smoke_labeled_sensor) + " (" + area + ")"] %}
          {% endif %}
        {% endfor %}
        {% if issues.total > limit %}
          {{ issues.list[:limit] | join('\n') ~ '\n... и ещё ' ~ (issues.total - limit) ~ ' датчик(а)' }}
        {% else %}
          {{ issues.list | join('\n') }}
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ device_name_with_area != '' }}"
        alias: If device_name_with_area is not empty
    then:
      - action: script.universal_notification_sender
        metadata: {}
        data:
          automation_trigger_id: "{{ trigger.id if trigger is defined else none }}"
          message_title: Обнаружено задымление!
          message_text: "{{ device_name_with_area }}"
          message_notification_id: smoke_sensors_smoke_detection_notification
          notify_if_trigger_id_is_none: false
mode: single
