# category
#   - Safety
# labels:
#   - scheduled
#   - notification
# entityId
#   - moisture_valves_periodic_exercise
# dependencies:
#   - moisture (label)
#   - moisture valve (label)
#   - Moisture sensor availability (Helper)
#   - Moisture valve availability (Helper)
#   - Close valve required time seconds (Helper)
#   - Moisture sensors leak detection (Automation)
#   - Close labeled moisture valves with retries (Script)
#   - Universal notification sender (Script)

alias: Moisture valves periodic exercise (v1.0)
description: |2-
  **Что делает:**
  Дважды в месяц закрывает все водопроводные краны с лейблом *moisture valve* и безопасно возвращает в открытое положение только те, которые были открыты до профилактики.

  **Как работает:**
  - Запоминает массив открытых кранов. Перед закрытием проверяет только, что основная аварийная автоматизация включена, а скрипт закрытия не выполняется.
  - Вызывает скрипт Close labeled moisture valves with retries, который закрывает все краны с повторными попытками.
  - Передаёт suppress_success_notification: true — при успешном закрытии уведомления нет, а при повторных попытках и ошибках скрипт оповещает как обычно.
  - После подтверждения закрытия всех кранов и повторной проверки безопасности открывает только краны из сохранённого массива. Изначально закрытые остаются закрытыми.
  - Если открыть воду небезопасно, оставляет краны закрытыми и отправляет уведомление.

  **Когда срабатывает:**
  - 📅 1-го и 15-го числа каждого месяца в 04:15.

  **Защита:**
  - Пропускает запуск с уведомлением, если основная аварийная автоматизация отключена или скрипт закрытия уже выполняется.
  - Перед открытием проверяет, что датчики сухие и доступны, а с начала цикла не срабатывала основная автоматизация протечки.
  - Если скрипт не смог закрыть все краны, дальнейшее выполнение прекращается: сообщение об ошибке уже отправлено скриптом.
  - Если список изначально открытых кранов пуст, команды открытия не отправляются. Если не все краны из сохранённого списка открылись, сообщает о необходимости ручной проверки.
  - Использует датчики протечки с лейблом moisture и суффиксом _water_leak; исключает датчики с лейблом moisture_valve_ignore.
  - Не заменяет независимую аппаратную защиту: полностью исключить гонку с аварийным перекрытием при одновременных командах невозможно.

  **Настройки:**
  - Close valve required time seconds — максимальное время ожидания открытия (при закрытии используется скриптом).
  - Close valves retry count — число попыток закрытия в переиспользуемом скрипте.
  - Перед включением проверьте лейблы, availability-сенсоры и состояния open/closed на реальном оборудовании.
triggers:
  # Каждый день в 04:15; условие ниже допускает только 1-е и 15-е числа месяца
  - id: scheduled
    trigger: time
    at: "04:15:00"
conditions:
  - alias: First and fifteenth day of the month
    condition: template
    value_template: "{{ now().day in [1, 15] }}"
actions:
  # Определяем все краны и датчики по тем же лейблам, что и в аварийной защите
  - variables:
      moisture_valves: >-
        {{ label_entities('moisture_valve') | select('match', '^valve[.]') | list }}
      moisture_sensors: >-
        {{ label_entities('moisture')
           | select('match', '^binary_sensor[.].*_water_leak$')
           | reject('in', label_entities('moisture_valve_ignore')) | list }}
      valve_availability_sensors: >-
        {{ label_entities('moisture_valve') | select('match', '^binary_sensor[.].*_availability$') | list }}
      sensor_availability_sensors: >-
        {{ label_entities('moisture') | select('match', '^binary_sensor[.].*_availability$') | list }}
      exercise_started_at: "{{ as_timestamp(now()) }}"
  # Запоминаем только изначально открытые краны и проверяем готовность аварийной защиты
  - variables:
      initially_open_valves: >-
        {{ expand(moisture_valves)
           | selectattr('state', 'eq', 'open')
           | map(attribute='entity_id')
           | list }}
      preflight_ok: >-
        {{ is_state('automation.moisture_sensors_leak_detection', 'on')
           and is_state('script.close_labeled_moisture_valves_with_retries', 'off') }}
  - if:
      - condition: template
        value_template: "{{ not (preflight_ok | bool(false)) }}"
    then:
      - action: script.universal_notification_sender
        metadata: {}
        data:
          automation_trigger_id: scheduled
          notify_if_trigger_id_is_none: true
          message_title: Профилактика кранов пропущена!
          message_text: >-
            Основная автоматизация защиты от протечек отключена или скрипт
            аварийного закрытия кранов уже выполняется. Краны не переключались.
          message_notification_id: moisture_valves_periodic_exercise_skipped
      - stop: Valve exercise preflight checks failed
  # Переиспользуем штатный скрипт аварийного закрытия: все краны сразу, с повторами
  - action: script.close_labeled_moisture_valves_with_retries
    metadata: {}
    data:
      suppress_success_notification: true
  # Скрипт сам уведомляет о неудачном закрытии. В этом случае ничего не открываем
  - alias: All moisture valves closed successfully
    condition: template
    value_template: >-
      {{ (expand(moisture_valves) | selectattr('state', 'eq', 'closed') | list | count) == (moisture_valves | count) }}
  # Если до профилактики все краны были закрыты, возвращать в open нечего
  - if:
      - condition: template
        value_template: "{{ (initially_open_valves | count) == 0 }}"
    then:
      - stop: No valves were initially open; nothing to restore
  # Перед открытием изначально открытых кранов повторно проверяем защиту
  - variables:
      safe_to_open: >-
        {% set last_leak = state_attr('automation.moisture_sensors_leak_detection', 'last_triggered') %}
        {{ (moisture_sensors | count) > 0
           and (valve_availability_sensors | count) == (moisture_valves | count)
           and (sensor_availability_sensors | count) == (moisture_sensors | count)
           and is_state('automation.moisture_sensors_leak_detection', 'on')
           and is_state('script.close_labeled_moisture_valves_with_retries', 'off')
           and (last_leak is none or as_timestamp(last_leak, 0) < (exercise_started_at | float(0)))
           and (expand(moisture_sensors) | selectattr('state', 'eq', 'off') | list | count) == (moisture_sensors | count)
           and (expand(valve_availability_sensors) | selectattr('state', 'eq', 'on') | list | count) == (valve_availability_sensors | count)
           and (expand(sensor_availability_sensors) | selectattr('state', 'eq', 'on') | list | count) == (sensor_availability_sensors | count)
           and (expand(moisture_valves) | selectattr('state', 'eq', 'closed') | list | count) == (moisture_valves | count) }}
  - if:
      - condition: template
        value_template: "{{ not (safe_to_open | bool(false)) }}"
    then:
      - action: script.universal_notification_sender
        metadata: {}
        data:
          automation_trigger_id: scheduled
          notify_if_trigger_id_is_none: true
          message_title: "Профилактика кранов: открытие запрещено!"
          message_text: >-
            После закрытия кранов не пройдена проверка безопасности: возможна протечка,
            срабатывание защиты или недоступность устройств. Все краны оставлены закрытыми.
            Проверьте систему вручную.
          message_notification_id: moisture_valves_periodic_exercise_failed
      - stop: Unsafe to reopen moisture valves
  # Восстанавливаем только те краны, которые были открыты до профилактики
  - action: valve.open_valve
    metadata: {}
    target:
      entity_id: "{{ initially_open_valves }}"
  - wait_template: >-
      {{ (expand(initially_open_valves) | selectattr('state', 'eq', 'open') | list | count) == (initially_open_valves | count) }}
    timeout:
      seconds: "{{ states('input_number.close_valve_required_time_seconds') | int(45) }}"
    continue_on_timeout: true
  - if:
      - condition: template
        value_template: "{{ not wait.completed }}"
    then:
      - action: script.universal_notification_sender
        metadata: {}
        data:
          automation_trigger_id: scheduled
          notify_if_trigger_id_is_none: true
          message_title: "Профилактика кранов: открытие не подтверждено!"
          message_text: >-
            Не все краны, открытые до профилактики, подтвердили возврат в open
            за установленное время. Проверьте водоснабжение вручную.
          message_notification_id: moisture_valves_periodic_exercise_failed
mode: single
