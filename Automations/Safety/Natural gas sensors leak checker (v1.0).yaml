# category
#   - Safety
# labels:
#   - notification
# entityId
#   - natural_gas_sensors_leak_checker
# dependencies:
#   - natural gas (label)
#   - Universal notification sender (Script)

alias: Natural gas sensors leak checker (v1.0)
description: |2-
  **🔧 Что делает:**
  Периодически проверяет, нет ли в доме активной утечки газа.
  Если датчик всё ещё показывает тревогу — отправляет повторное оповещение.

  **⚙️ Как приходит оповещение:**
  - Если активны 1–5 датчиков — в сообщении перечислены их названия и комнаты.
  - Если больше 5 — показаны первые пять, а затем общее количество оставшихся.
  - Оповещение обновляется при каждой проверке, пока датчики не вернутся в
  норму.

  **📅 Когда срабатывает проверка:**  
  - 📅 Каждое утро в 08:02 (дополнительный контроль).
  - 🔄 Через несколько минут после запуска системы (чтобы датчики успели
  обновить своё состояние).
  - 🔔 Сразу после того, как вы закрыли уведомление об утечке — чтобы перепроверить, не осталось ли газа.
triggers:
  - trigger: persistent_notification
    update_type:
      - removed
    id: persistent_notification_removed
  - alias: >-
      When system uptime + 5 greater than Natural gas sensors availability
      timeout minutes
    trigger: template
    value_template: |-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int - 
          states('input_number.natural_gas_sensors_availability_timeout_minutes') | int
          ) > 5 
      }}
  - trigger: time
    at: "08:02:22"
    id: fixed_time
conditions:
  - condition: or
    conditions:
      - condition: and
        conditions:
          - condition: trigger
            id:
              - persistent_notification_removed
          - condition: template
            value_template: >-
              {{ trigger.notification.notification_id is
              match('natural_gas_sensors_leak_detection_notification.*') }}
      - condition: and
        conditions:
          - condition: not
            conditions:
              - condition: trigger
                id:
                  - persistent_notification_removed
actions:
  - variables:
      device_name_with_area: |
        {% set limit = 5 %} 
        {% set issues = namespace(total=0, list=[]) %}

        {% set natural_gas_labeled_sensors = label_entities("natural_gas") 
           | select('match', '.*_gas_leak$')
           | list %}

        {% for natural_gas_labeled_sensor in natural_gas_labeled_sensors %}
          {% if states(natural_gas_labeled_sensor) == 'on' %}
            {% set issues.total = issues.total + 1 %}

            {% set area_id = device_attr(natural_gas_labeled_sensor, 'area_id') %}
            {% set area = area_name(area_id) if area_id else "Без комнаты" %}
            {% set issues.list = issues.list + [device_name(natural_gas_labeled_sensor) + " (" + area + ")"] %}
          {% endif %}
        {% endfor %}
        {% if issues.total > limit %}
          {{ issues.list[:limit] | join('\n') ~ '\n... и ещё ' ~ (issues.total - limit) ~ ' датчик(а)' }}
        {% else %}
          {{ issues.list | join('\n') }}
        {% endif %}
  - action: script.universal_notification_sender
    metadata: {}
    data:
      automation_trigger_id: "{{ trigger.id if trigger is defined else none }}"
      message_title: Обнаружена утечка газа!
      message_text: "{{ device_name_with_area }}"
      message_notification_id: natural_gas_sensors_leak_detection_notification
mode: single
