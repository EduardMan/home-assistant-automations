# category
#   - System
# labels:
#   - notification
#   - scheduled
# entityId
#   - expected_labels_checker
# dependencies:
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Expected labels checker (v1.0)
description: |2-
  **🔧 Что делает:**  
  Проверяет, что в системе созданы все обязательные лейблы из заданного списка и их названия не изменены.

  **⚙️ Как приходит оповещение:**  
  - Если лейбл отсутствует полностью — сообщение «Отсутствует: …».  
  - Если имя лейбла отличается от ожидаемого — сообщение «Неверное имя: …».  
  - Если проблем больше 5, выводятся только первые 5, а затем общее количество оставшихся.

  **📅 Когда срабатывает проверка:**  
  - 🔄 Через несколько минут после запуска системы (чтобы все компоненты загрузились)  
  - 📅 Каждое утро в 08:00  
  - 🔔 Сразу после закрытия уведомления о проблемах — автоматизация перепроверит список

  **🛠️ Настройки:**  
  - Внутри действия `variables` → `expected_labels`.  
  - Каждый элемент содержит `label_id` (идентификатор лейбла) и `label_name` (ожидаемое отображаемое имя).
triggers:
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: labels_missing_notification
    id: persistent_notification_removed
  # Через 5 минут после запуска системы
  - alias: After 5 min start up
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int
          ) > 5 
      }}
conditions: [ ]
actions:
  # Определяем список лейблов, которые обязательны в системе
  - variables:
      expected_labels:
        - label_id: door
          label_name: door
        - label_id: moisture
          label_name: moisture
        - label_id: motion
          label_name: motion
        - label_id: temperature
          label_name: temperature
        - label_id: smoke
          label_name: smoke
        - label_id: natural_gas
          label_name: natural gas
        - label_id: notification
          label_name: notification
        - label_id: scheduled
          label_name: scheduled
        - label_id: moisture_valve
          label_name: moisture valve
  # Находим отсутствующие лейблы
  - variables:
      missing_labels: |
        {% set limit = 5 %}
        {% set issues = namespace(total=0, list=[]) %}
        {% for expected_label in expected_labels %}
          {% set label = label_name(expected_label.label_id) %}
          {% if label is none %}
            {% set issues.total = issues.total + 1 %}
            {% set issues.list = issues.list + ["Отсутствует лейбл с id: " + expected_label.label_id] %}
          {% elif label != expected_label.label_name %}
            {% set issues.total = issues.total + 1 %}
            {% set issues.list = issues.list + ["Неверное имя лейбла с id: " + expected_label.label_id] %}
          {% endif %}
        {% endfor %}

        {% if issues.total > limit %}
          {{ issues.list[:limit] | join('\n') ~ '\n... и ещё ' ~ (issues.total - limit) ~ ' проблем(ы)' }}
        {% else %}
          {{ issues.list | join('\n') }}
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ missing_labels | length > 0 }}"
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          notify_if_trigger_id_is_none: true
          automation_trigger_id: "{{ trigger.id }}"
          message_text: "{{ missing_labels }}"
          message_notification_id: labels_missing_notification
          message_title: Проблема лейблов в системе!
mode: single
