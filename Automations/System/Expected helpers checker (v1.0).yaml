# category
#   - Device health
# labels:
#   - notification
#   - scheduled
# entityId
#   - expected_helpers_checker
# dependencies:
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Expected helpers checker (v1.0)
description: >-
  **Что делает:**  
  Проверяет, что в системе присутствуют все обязательные хелперы, заданные списком внутри автоматизации, и их названия не изменены.

  **Как приходит оповещение:**  
  - Если хелпер отсутствует полностью — сообщение «Отсутствует: …».  
  - Если имя хелпера отличается от ожидаемого — сообщение «Неверное имя: …».  
  - Если проблем больше 5, выводятся только первые 5, а затем общее количество оставшихся.

  **Когда срабатывает проверка:**  
  - 🔄 Через несколько минут после запуска системы (чтобы все компоненты загрузились)  
  - 📅 Каждое утро в 08:00  
  - 🔔 Сразу после закрытия уведомления о проблемах — автоматизация перепроверит список

  **Настройки:**  
  - Внутри действия `variables` → `expected_helpers`.  
  - Каждый элемент — точный `entity_id` и ожидаемое `name`.
triggers:
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: helpers_missing_notification
    id: persistent_notification_removed
  # Через 5 минут после запуска системы
  - alias: After 5 min start up
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int
          ) > 5 
      }}
conditions: [ ]
actions:
  # Определяем список хелперов, которые обязательны в системе
  - variables:
      expected_helpers:
        # Moisture
        - entity_id: input_number.moisture_sensors_expected_count
          name: Moisture sensors expected count
        - entity_id: input_number.moisture_sensors_availability_timeout_minutes
          name: Moisture sensors availability timeout minutes
        - entity_id: input_number.moisture_sensors_battery_threshold
          name: Moisture sensors battery threshold
        - entity_id: input_number.moisture_sensors_available_count
          name: Moisture sensors available count
        - entity_id: input_number.moisture_sensors_unavailable_count
          name: Moisture sensors unavailable count
        - entity_id: input_number.moisture_sensors_discharged_count
          name: Moisture sensors discharged count
        # Door
        - entity_id: input_number.door_sensors_expected_count
          name: Door sensors expected count
        - entity_id: input_number.door_sensors_availability_timeout_minutes
          name: Door sensors availability timeout minutes
        - entity_id: input_number.door_sensors_battery_threshold
          name: Door sensors battery threshold
        - entity_id: input_number.door_sensors_available_count
          name: Door sensors available count
        - entity_id: input_number.door_sensors_unavailable_count
          name: Door sensors unavailable count
        - entity_id: input_number.door_sensors_discharged_count
          name: Door sensors discharged count
        # Motion
        - entity_id: input_number.motion_sensors_expected_count
          name: Motion sensors expected count
        - entity_id: input_number.motion_sensors_availability_timeout_minutes
          name: Motion sensors availability timeout minutes
        - entity_id: input_number.motion_sensors_battery_threshold
          name: Motion sensors battery threshold
        - entity_id: input_number.motion_sensors_available_count
          name: Motion sensors available count
        - entity_id: input_number.motion_sensors_unavailable_count
          name: Motion sensors unavailable count
        - entity_id: input_number.motion_sensors_discharged_count
          name: Motion sensors discharged count
        # Smoke
        - entity_id: input_number.smoke_sensors_expected_count
          name: Smoke sensors expected count
        - entity_id: input_number.smoke_sensors_availability_timeout_minutes
          name: Smoke sensors availability timeout minutes
        - entity_id: input_number.smoke_sensors_battery_threshold
          name: Smoke sensors battery threshold
        - entity_id: input_number.smoke_sensors_available_count
          name: Smoke sensors available count
        - entity_id: input_number.smoke_sensors_unavailable_count
          name: Smoke sensors unavailable count
        - entity_id: input_number.smoke_sensors_discharged_count
          name: Smoke sensors discharged count
        # Temperature
        - entity_id: input_number.temperature_sensors_expected_count
          name: Temperature sensors expected count
        - entity_id: input_number.temperature_sensors_availability_timeout_minutes
          name: Temperature sensors availability timeout minutes
        - entity_id: input_number.temperature_sensors_battery_threshold
          name: Temperature sensors battery threshold
        - entity_id: input_number.temperature_sensors_available_count
          name: Temperature sensors available count
        - entity_id: input_number.temperature_sensors_unavailable_count
          name: Temperature sensors unavailable count
        - entity_id: input_number.temperature_sensors_discharged_count
          name: Temperature sensors discharged count
        # Natural gas
        - entity_id: input_number.natural_gas_sensors_expected_count
          name: Natural gas sensors expected count
        - entity_id: input_number.natural_gas_sensors_available_count
          name: Natural gas sensors available count
        - entity_id: input_number.natural_gas_sensors_unavailable_count
          name: Natural gas sensors unavailable count
  # Находим отсутствующие хелперы
  - variables:
      missing_helpers: |
        {% set limit = 5 %}
        {% set issues = namespace(total=0, list=[]) %}
        {% for helper in expected_helpers %}
          {% set state = states(helper.entity_id) %}
          {% set friendly_name = state_attr(helper.entity_id, 'friendly_name') %}
          {% if state == 'unknown' %}
            {% set issues.total = issues.total + 1 %}
            {% set issues.list = issues.list + ["Отсутствует: " + helper.entity_id] %}
          {% elif friendly_name != helper.name %}
            {% set issues.total = issues.total + 1 %}
            {% set issues.list = issues.list + ["Неверное имя: " + helper.entity_id] %}
          {% endif %}
        {% endfor %}

        {% if issues.total > limit %}
          {{ issues.list[:limit] | join('\n') ~ '\n... и ещё ' ~ (issues.total - limit) ~ ' проблем(ы)' }}
        {% else %}
          {{ issues.list | join('\n') }}
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ missing_helpers | length > 0 }}"
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          automation_trigger_id: "{{ trigger.id }}"
          message_text: "{{ missing_helpers }}"
          message_notification_id: helpers_missing_notification
          message_title: Проблема хелперов в системе!
mode: single
