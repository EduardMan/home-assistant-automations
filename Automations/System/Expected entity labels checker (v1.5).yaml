# category
#   - System
# labels:
#   - notification
#   - scheduled
# entityId
#   - expected_entity_labels_checker
# dependencies:
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)
alias: Expected entity labels checker (v1.5)
description: |2-
  **Что делает:**  
  Проверяет, что у всех нужных сенсоров проставлены обязательные лейблы.  
  Если у какого-то сенсора лейбл отсутствует — приходит уведомление.

  **Как приходит оповещение:**  
  - Для каждого типа сенсоров из списка проверяется наличие заданного лейбла.  
  - При отсутствии лейбла в уведомлении указывается имя устройства и какой лейбл должен быть.  
  - Если проблем больше 5, выводятся первые 5, а затем общее количество оставшихся.

  **Когда срабатывает проверка:**  
  - 🔄 Через несколько минут после запуска системы (чтобы все сенсоры загрузились)  
  - 📅 Каждое утро в 08:00  
  - 🔔 Сразу после закрытия уведомления о проблемах — автоматизация перепроверит список

  **Где задаётся список проверяемых лейблов:**  
  - Внутри действия `variables` → `expected_labels`.  
  - В каждом правиле укажите домен `entity_type` и обязательный лейбл `label`.
  - Для отбора по имени добавьте регулярное выражение `entity_id_postfix`.
  - Для отбора по устройству добавьте список `models`. Достаточно точного совпадения с `model_id` или `model` в реестре устройств Home Assistant.
triggers:
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: entity_labels_missing_notification
    id: persistent_notification_removed
  # Через 5 минут после запуска системы
  - alias: After 5 min start up
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int
          ) > 5 
      }}
conditions: [ ]
actions:
  # Определяем список лейблов, которые обязательны в системе
  - variables:
      expected_labels:
        - entity_type: binary_sensor
          entity_id_postfix: .*_water_leak$
          label: moisture
        - entity_type: valve
          label: moisture_valve
        - entity_type: binary_sensor
          entity_id_postfix: .*_gas_leak$
          label: natural_gas
        - entity_type: binary_sensor
          entity_id_postfix: .*_smoke$
          label: smoke
        - entity_type: sensor
          entity_id_postfix: .*_local_temperature$
          models:
            - BRT-100-TRV
          label: heating_thermostat
        - entity_type: sensor
          entity_id_postfix: .*_temperature$
          models:
            - WSDCGQ11LM
          label: temperature
        - entity_type: media_player
          models:
            - Станция (2018)
            - Станция Макс (2020)
            - Станция Мини (2019)
            - Станция Мини 2 (2021)
            - Станция Мини 3 (2024)
            - Станция Лайт (2021)
            - Станция Лайт 2 (2024)
            - Станция 2 (2022)
            - Станция Миди (2023)
            - Станция Дуо Макс (2023)
            - Станция 3 (2025)
            - Станция Стрит (2025)
            - Станция Мини 3 Про (2025)
          label: smart_speaker
  # Находим отсутствующие лейблы
  - variables:
      missing_labels: |
        {% set limit = 5 %}
        {% set issues = namespace(total=0, list=[]) %}

        {% for expected_label in expected_labels %}
          {% set required_label = expected_label.label %}
          {% set candidates = states[expected_label.entity_type] | map(attribute='entity_id') %}
          {% if expected_label.entity_id_postfix is defined %}
            {% set candidates = candidates | select('match', expected_label.entity_id_postfix) %}
          {% endif %}

          {% for sensor in candidates if required_label not in labels(sensor) %}
            {% if expected_label.models is not defined
                  or device_attr(sensor, 'model_id') in expected_label.models
                  or device_attr(sensor, 'model') in expected_label.models %}
              {% set issues.total = issues.total + 1 %}
              {% set issues.list = issues.list + [(device_name(sensor) or sensor) + ' (' + required_label + ')'] %}
            {% endif %}
          {% endfor %}
        {% endfor %}

        {% if issues.total > limit %}
          {{ issues.list[:limit] | join('\n') ~ '\n... и ещё ' ~ (issues.total - limit) ~ ' проблем(ы)' }}
        {% else %}
          {{ issues.list | join('\n') }}
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ missing_labels | length > 0 }}"
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          automation_trigger_id: "{{ trigger.id }}"
          message_text: "{{ missing_labels }}"
          message_notification_id: entity_labels_missing_notification
          message_title: Не хватает лейблов на сенсорах!
          notify_if_trigger_id_is_none: true
mode: single
