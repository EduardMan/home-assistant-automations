# category
#   - System
# labels:
#   - notification
#   - scheduled
# entityId
#   - expected_helpers_checker
# dependencies:
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Expected helpers checker (v1.2)
description: |2-
  **Что делает:**  
  Проверяет, что в системе присутствуют все обязательные хелперы, заданные списком внутри автоматизации, и их названия не изменены.

  **Как приходит оповещение:**  
  - Если хелпер отсутствует полностью — сообщение «Отсутствует: …».  
  - Если имя хелпера отличается от ожидаемого — сообщение «Неверное имя: …».  
  - Если проблем больше 5, выводятся только первые 5, а затем общее количество оставшихся.

  **Когда срабатывает проверка:**  
  - 🔄 Через несколько минут после запуска системы (чтобы все компоненты загрузились)  
  - 📅 Каждое утро в 08:00  
  - 🔔 Сразу после закрытия уведомления о проблемах — автоматизация перепроверит список

  **Настройки:**  
  - Внутри действия `variables` → `expected_helpers`.  
  - Каждый элемент — точный `entity_id` и ожидаемое `name`.
triggers:
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: helpers_missing_notification
    id: persistent_notification_removed
  # Через 5 минут после запуска системы
  - alias: After 5 min start up
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int
          ) > 5 
      }}
conditions: [ ]
actions:
  # Определяем список хелперов, которые обязательны в системе
  - variables:
      expected_helpers:
        # Moisture
        - entity_id: input_number.moisture_sensors_expected_count
          name: Moisture sensors expected count (v1.0)
          label: "moisture"
        - entity_id: input_number.moisture_sensors_availability_timeout_minutes
          name: Moisture sensors availability timeout minutes (v1.0)
          label: "moisture"
        - entity_id: input_number.moisture_sensors_battery_threshold
          name: Moisture sensors battery threshold (v1.0)
          label: "moisture"
        - entity_id: number.moisture_sensors_available_count
          name: Moisture sensors available count (v1.0)
          label: "moisture"
        - entity_id: number.moisture_sensors_unavailable_count
          name: Moisture sensors unavailable count (v1.0)
          label: "moisture"
        - entity_id: number.moisture_sensors_discharged_count
          name: Moisture sensors discharged count (v1.1)
          label: "moisture"
        # Door
        - entity_id: input_number.door_sensors_expected_count
          name: Door sensors expected count (v1.0)
          label: "door"
        - entity_id: input_number.door_sensors_availability_timeout_minutes
          name: Door sensors availability timeout minutes (v1.0)
          label: "door"
        - entity_id: input_number.door_sensors_battery_threshold
          name: Door sensors battery threshold (v1.0)
          label: "door"
        - entity_id: number.door_sensors_available_count
          name: Door sensors available count (v1.0)
          label: "door"
        - entity_id: number.door_sensors_unavailable_count
          name: Door sensors unavailable count (v1.0)
          label: "door"
        - entity_id: number.door_sensors_discharged_count
          name: Door sensors discharged count (v1.0)
          label: "door"
        # Motion
        - entity_id: input_number.motion_sensors_expected_count
          name: Motion sensors expected count (v1.0)
          label: "motion"
        - entity_id: input_number.motion_sensors_availability_timeout_minutes
          name: Motion sensors availability timeout minutes (v1.0)
          label: "motion"
        - entity_id: input_number.motion_sensors_battery_threshold
          name: Motion sensors battery threshold (v1.0)
          label: "motion"
        - entity_id: number.motion_sensors_available_count
          name: Motion sensors available count (v1.0)
          label: "motion"
        - entity_id: number.motion_sensors_unavailable_count
          name: Motion sensors unavailable count (v1.0)
          label: "motion"
        - entity_id: number.motion_sensors_discharged_count
          name: Motion sensors discharged count (v1.0)
          label: "motion"
        # Smoke
        - entity_id: input_number.smoke_sensors_expected_count
          name: Smoke sensors expected count (v1.0)
          label: "smoke"
        - entity_id: input_number.smoke_sensors_availability_timeout_minutes
          name: Smoke sensors availability timeout minutes (v1.0)
          label: "smoke"
        - entity_id: input_number.smoke_sensors_battery_threshold
          name: Smoke sensors battery threshold (v1.0)
          label: "smoke"
        - entity_id: number.smoke_sensors_available_count
          name: Smoke sensors available count (v1.0)
          label: "smoke"
        - entity_id: number.smoke_sensors_unavailable_count
          name: Smoke sensors unavailable count (v1.0)
          label: "smoke"
        - entity_id: number.smoke_sensors_discharged_count
          name: Smoke sensors discharged count (v1.0)
          label: "smoke"
        # Temperature
        - entity_id: input_number.temperature_sensors_expected_count
          name: Temperature sensors expected count (v1.0)
          label: "temperature"
        - entity_id: input_number.temperature_sensors_availability_timeout_minutes
          name: Temperature sensors availability timeout minutes (v1.0)
          label: "temperature"
        - entity_id: input_number.temperature_sensors_battery_threshold
          name: Temperature sensors battery threshold (v1.0)
          label: "temperature"
        - entity_id: number.temperature_sensors_available_count
          name: Temperature sensors available count (v1.0)
          label: "temperature"
        - entity_id: number.temperature_sensors_unavailable_count
          name: Temperature sensors unavailable count (v1.0)
          label: "temperature"
        - entity_id: number.temperature_sensors_discharged_count
          name: Temperature sensors discharged count (v1.0)
          label: "temperature"
        # Natural gas
        - entity_id: input_number.natural_gas_sensors_expected_count
          name: Natural gas sensors expected count (v1.0)
          label: "natural_gas"
        - entity_id: number.natural_gas_sensors_available_count
          name: Natural gas sensors available count (v1.0)
          label: "natural_gas"
        - entity_id: number.natural_gas_sensors_unavailable_count
          name: Natural gas sensors unavailable count (v1.0)
          label: "natural_gas"
        - entity_id: input_number.natural_gas_sensors_leak_detection_threshold
          name: Natural gas sensors leak detection threshold (v1.0)
          label: "natural_gas"
        - entity_id: input_number.natural_gas_sensors_availability_timeout_minutes
          name: Natural gas sensors availability timeout minutes (v1.0)
          label: "natural_gas"
        # Moisture valve
        - entity_id: input_number.moisture_valves_expected_count
          name: Moisture valves expected count (v1.0)
          label: "moisture_valve"
        - entity_id: input_number.moisture_valves_availability_timeout_minutes
          name: Moisture valves availability timeout minutes (v1.0)
          label: "moisture_valve"
        - entity_id: number.moisture_valves_available_count
          name: Moisture valves available count (v1.0)
          label: "moisture_valve"
        - entity_id: number.moisture_valves_unavailable_count
          name: Moisture valves unavailable count (v1.0)
          label: "moisture_valve"
        - entity_id: input_number.close_valve_required_time_seconds
          name: Close valve required time seconds (v1.0)
          label: "moisture_valve"
        - entity_id: input_number.close_valves_retry_count
          name: Close valves retry count (v1.0)
          label: "moisture_valve"
        # Common
        - entity_id: input_number.untracked_zigbee_sensors_availability_timeout_minutes
          name: Untracked zigbee sensors availability timeout minutes (v1.0)
        - entity_id: input_number.untracked_zigbee_sensors_battery_threshold
          name: Untracked zigbee sensors battery threshold (v1.0)
        - entity_id: number.untracked_zigbee_sensors_discharged_count
          name: Untracked zigbee sensors discharged count (v1.1)
        - entity_id: number.untracked_zigbee_sensors_unavailable_count
          name: Untracked zigbee sensors unavailable count (v1.0)
        - entity_id: number.untracked_zigbee_sensors_unavailable_ignore_count
          name: Untracked zigbee sensors unavailable ignore count (v1.0)
        # GSM
        - entity_id: input_number.gsm_modules_availability_timeout_minutes
          name: GSM module availability timeout minutes (v1.0)
        - entity_id: input_number.ussd_balance_extracting_required_time_seconds
          name: USSD balance extracting required time seconds (v1.0)
        - entity_id: input_number.ussd_balance_extracting_retry_count
          name: USSD balance extracting retry count (v1.0)
        - entity_id: input_number.ussd_balance_extracting_retry_count
          name: USSD balance extracting retry count (v1.0)
        - entity_id: input_number.gsm_modules_sim_balance_threshold
          name: GSM modules sim balance threshold (v1.0)
        - entity_id: input_number.gsm_phone_call_duration_seconds
          name: GSM phone call duration seconds (v1.0)
        - entity_id: number.gsm_modules_available_count
          name: GSM modules available count (v1.0)
        - entity_id: number.gsm_modules_unavailable_count
          name: GSM modules unavailable count (v1.0)
  # Находим отсутствующие хелперы
  - variables:
      missing_helpers: |
        {% set limit = 5 %}
        {% set issues = namespace(total=0, list=[]) %}
        {% for helper in expected_helpers %}
          {% set state = states(helper.entity_id) %}
          {% set friendly_name = state_attr(helper.entity_id, 'friendly_name') %}
          {% set labels = labels(helper.entity_id) %}
          {% if state == 'unknown' %}
            {% set issues.total = issues.total + 1 %}
            {% set issues.list = issues.list + ["Отсутствует: " + helper.entity_id] %}
          {% elif friendly_name != helper.name %}
            {% set issues.total = issues.total + 1 %}
            {% set issues.list = issues.list + ["Неверное имя: " + helper.entity_id] %}
          {% elif (helper.label is defined) and (helper.label not in labels) %}
            {% set issues.total = issues.total + 1 %}
            {% set issues.list = issues.list + ["Неверный лейбл: " + friendly_name] %}
          {% endif %}
        {% endfor %}

        {% if issues.total > limit %}
          {{ issues.list[:limit] | join('\n') ~ '\n... и ещё ' ~ (issues.total - limit) ~ ' проблем(ы)' }}
        {% else %}
          {{ issues.list | join('\n') }}
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ missing_helpers | length > 0 }}"
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          notify_if_trigger_id_is_none: true
          automation_trigger_id: "{{ trigger.id }}"
          message_text: "{{ missing_helpers }}"
          message_notification_id: helpers_missing_notification
          message_title: Проблема хелперов в системе!
mode: single
