# category
#   - System
# labels:
#   - notification
#   - scheduled
# entityId
#   - expected_availability_helper_checker
# dependencies:
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)

alias: Expected availability helper checker (v1.2)
description: |2-
  **Что делает:**  
  Проверяет, что для каждого датчика из списка создан ровно один *availability*-сенсор и на нём висит правильный лейбл.  
  Если availability отсутствует или лейбл не совпадает — приходит уведомление.

  **Как приходит оповещение:**  
  - Для каждого типа датчиков (протечка, температура, открытие) проверяется наличие availability-сенсора и нужного лейбла.  
  - Если availability нет, сообщается имя устройства и текст «Отсутствует availability».  
  - Если лейбл неверный — сообщение «Отсутствует лейбл» с указанием ожидаемого.  
  - При большом количестве проблем показываются первые 5, а затем общее число оставшихся.

  **Когда срабатывает проверка:**  
  - 🔄 Через 5 минут после запуска системы (чтобы все сенсоры загрузились)  
  - 📅 Каждое утро в 08:00  
  - 🔔 Сразу после закрытия уведомления о проблемах — автоматизация перепроверит наличие availability

  **Настройки:**  
  - Внутри действия `variables` → `expected_availability_helper`.  
  - Каждый элемент: `entity_id_postfix` (шаблон имени датчика), `label` (ожидаемый лейбл), `type` (`binary_sensor` или `sensor`).
triggers:
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: availability_helper_missing_notification
    id: persistent_notification_removed
  # Через 5 минут после запуска системы
  - alias: After 5 min start up
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int
          ) > 5 
      }}
conditions: [ ]
actions:
  # Определяем список сенсоров, которым необходим availability
  - variables:
      expected_availability_helper:
        - entity_id_postfix: .*_water_leak$
          label: moisture
          type: binary_sensor
        - entity_id_postfix: .*_temperature$
          label: temperature
          type: sensor
        - entity_id_postfix: .*_contact$
          label: door
          type: binary_sensor
        - label: moisture_valve
          type: valve
        - entity_id_postfix: .*_gas_leak$
          label: natural_gas
          type: binary_sensor
        - entity_id_postfix: .*_smoke$
          label: smoke
          type: binary_sensor
        - entity_id_postfix: .*_radiator_local_temperature$
          label: heating_thermostat
          type: sensor
  # Находим сенсоры у которых отсутствуют availability
  - variables:
      missing_availability_helper: |
        {% set limit = 5 %}
        {% set issues = namespace(total=0, list=[]) %}
        {% for helper in expected_availability_helper %}

          {% set required_label = helper.label %}
          {% set entity_id_postfix = helper.entity_id_postfix %}
          {% set type = helper.type %}

          {% if type == 'binary_sensor' %}
            {% set filtered_sensors_by_prefix = states.binary_sensor
               | selectattr('entity_id', 'match', entity_id_postfix)
               | map(attribute='entity_id')
               | list %}
            {% set filtered_sensors = label_entities(required_label) | select('in', filtered_sensors_by_prefix) | list %}
          {% elif type == 'sensor' %}
            {% set filtered_sensors_by_prefix = states.sensor
               | selectattr('entity_id', 'match', entity_id_postfix)
               | map(attribute='entity_id')
               | list %}
            {% set filtered_sensors = label_entities(required_label) | select('in', filtered_sensors_by_prefix) | list %}
          {% elif type == 'valve' %}
            {% set filtered_sensors_by_prefix = states.valve
               | map(attribute='entity_id')
               | list %}
            {% set filtered_sensors = label_entities(required_label) | select('in', filtered_sensors_by_prefix) | list %}
          {% endif %}

          {% for dev in filtered_sensors %}
            {% set availability_sensor = device_entities(device_id(dev)) | select('match', '.*_availability$') | list %}

            {% if availability_sensor | count != 1 %}
              {% set issues.total = issues.total + 1 %}
              {% set issues.list = issues.list + ["Отсутствует availability: " + device_name(dev)] %}
            {% elif (availability_sensor | count == 1) and (required_label not in labels(availability_sensor | first)) %}
                {% set issues.total = issues.total + 1 %}
              {% set issues.list = issues.list + ["Отсутствует лейбл: " + device_name(dev) + ' (' + required_label + ')'] %}
            {% endif %}
          {% endfor %}

        {% endfor %}

        {% if issues.total > limit %}
          {{ issues.list[:limit] | join('\n') ~ '\n... и ещё ' ~ (issues.total - limit) ~ ' проблем(ы)' }}
        {% else %}
          {{ issues.list | join('\n') }}
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ missing_availability_helper | length > 0 }}"
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          automation_trigger_id: "{{ trigger.id }}"
          message_text: "{{ missing_availability_helper }}"
          message_notification_id: availability_helper_missing_notification
          message_title: Не хватает сенсоров доступности!
          notify_if_trigger_id_is_none: true
mode: single
