# category
#   - System
# labels:
#   - notification
#   - scheduled
# entityId
#   - expected_entity_labels_checker
# dependencies:
#   - sensor.uptime (Integration)
#   - Universal notification sender (Script)
alias: Expected entity labels checker (v1.1)
description: |2-
  **Что делает:**  
  Проверяет, что у всех нужных сенсоров проставлены обязательные лейблы.  
  Если у какого-то сенсора лейбл отсутствует — приходит уведомление.

  **Как приходит оповещение:**  
  - Для каждого типа сенсоров из списка проверяется наличие заданного лейбла.  
  - При отсутствии лейбла в уведомлении указывается имя устройства и какой лейбл должен быть.  
  - Если проблем больше 5, выводятся первые 5, а затем общее количество оставшихся.

  **Когда срабатывает проверка:**  
  - 🔄 Через несколько минут после запуска системы (чтобы все сенсоры загрузились)  
  - 📅 Каждое утро в 08:00  
  - 🔔 Сразу после закрытия уведомления о проблемах — автоматизация перепроверит список

  **Где задаётся список проверяемых лейблов:**  
  - Внутри действия `variables` → `expected_labels`.  
  - Каждый элемент: `entity_id_postfix` (шаблон имени сенсора) и `label` (обязательный лейбл).
triggers:
  # Каждый день в 08:00
  - trigger: time
    at: "08:00:00"
  - trigger: persistent_notification
    update_type:
      - removed
    notification_id: labels_missing_notification
    id: persistent_notification_removed
  # Через 5 минут после запуска системы
  - alias: After 5 min start up
    trigger: template
    value_template: >-
      {{ (
          ((as_timestamp(now()) - as_timestamp(states('sensor.uptime'))) / 60) | int
          ) > 5 
      }}
conditions: [ ]
actions:
  # Определяем список лейблов, которые обязательны в системе
  - variables:
      expected_labels:
        - entity_id_postfix: .*_water_leak$
          label: moisture
        - entity_type: valve
          label: moisture_valve
        - entity_id_postfix: .*_gas_leak$
          label: natural_gas
        - entity_id_postfix: .*_smoke$
          label: smoke
  # Находим отсутствующие лейблы
  - variables:
      missing_labels: |
        {% set limit = 5 %}
        {% set issues = namespace(total=0, list=[]) %}

        {% for expected_label in expected_labels %}
          {% set required_label = expected_label.label %}
          {% set entity_id_postfix = expected_label.entity_id_postfix %}
        
          {% if 'entity_type' in expected_label %}
            {% set filtered_sensors = states[expected_label.entity_type]
              | map(attribute='entity_id')
              | list %}  
          {% else %}
            {% set filtered_sensors = states.binary_sensor
              | selectattr('entity_id', 'match', entity_id_postfix)
              | map(attribute='entity_id')
              | list %}
          {% endif %}

          {% for sensor in filtered_sensors %}
            {% if required_label not in labels(sensor) %}
              {% set issues.total = issues.total + 1 %}
              {% set issues.list = issues.list + [device_name(sensor) + ' (' + required_label + ')'] %}
            {% endif %}
          {% endfor %}
        {% endfor %}

        {% if issues.total > limit %}
          {{ issues.list[:limit] | join('\n') ~ '\n... и ещё ' ~ (issues.total - limit) ~ ' проблем(ы)' }}
        {% else %}
          {{ issues.list | join('\n') }}
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ missing_labels | length > 0 }}"
    then:
      - action: script.universal_notification_sender
        metadata: { }
        data:
          automation_trigger_id: "{{ trigger.id }}"
          message_text: "{{ missing_labels }}"
          message_notification_id: labels_missing_notification
          message_title: Не хватает лейблов на сенсорах!
          notify_if_trigger_id_is_none: true
mode: single
