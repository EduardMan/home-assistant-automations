# category
#   - Routine
# labels:
#   - scheduled
# entityId
#   - bedroom_heating_thermostat_external_temperature_calibration
# dependencies:
#   - sensor.spalnia_datchik_temperatury_temperature (Aqara WSDCGQ11LM)
#   - sensor.spalnia_termostat_radiator_local_temperature (Moes BRT-100-TRV)
#   - number.spalnia_termostat_radiator_local_temperature_calibration (Moes BRT-100-TRV)

alias: Bedroom heating thermostat external temperature calibration (v1.0)
description: |2-
  **Что делает:**
  Корректирует измеряемую термостатом Moes температуру по внешнему датчику Aqara.
  Сам Moes продолжает управлять радиатором и заданной температурой.

  **Как рассчитывается калибровка:**
  - Новая поправка = текущая поправка + температура Aqara − температура Moes.
  - Результат округляется до целого градуса и ограничивается диапазоном от −9 до +9 °C.
  - Если рассчитанное значение совпадает с текущим, команда термостату не отправляется.

  **Когда срабатывает:**
  - 📅 Каждые 5 минут — даже если необходима поправка всего на 1 °C.
  - 🌡️ Немедленно, если расхождение между Aqara и Moes достигло 2 °C или больше (переход через порог).

  **Защита от лишних команд и неверных данных:**
  - Не изменяет калибровку при неизвестной или недоступной температуре либо поправке.
  - Не использует показания датчиков, которые не обновлялись больше 6 часов.
  - После изменения калибровки ждёт нового отчёта температуры Moes, чтобы не пересчитывать поправку по старому показанию.
  - Никаких дополнительных хелперов, таймеров и интервалов ожидания.
triggers:
  # Плановая проверка каждые 5 минут — при необходимости корректируем даже на 1 °C
  - id: scheduled
    trigger: time_pattern
    minutes: "/5"
  # Внеплановая проверка при переходе расхождения температур через порог 2 °C
  - id: deviation
    trigger: template
    value_template: >-
      {% set aqara = states('sensor.spalnia_datchik_temperatury_temperature') %}
      {% set moes = states('sensor.spalnia_termostat_radiator_local_temperature') %}
      {{ is_number(aqara) and is_number(moes)
         and (((aqara | float(0)) - (moes | float(0))) | abs) >= 2 }}
conditions:
  # Не выполняем калибровку, если хотя бы одно исходное значение недоступно
  - alias: Aqara temperature, Moes temperature and current calibration are numeric
    condition: template
    value_template: >-
      {{ is_number(states('sensor.spalnia_datchik_temperatury_temperature'))
         and is_number(states('sensor.spalnia_termostat_radiator_local_temperature'))
         and is_number(states('number.spalnia_termostat_radiator_local_temperature_calibration')) }}
  # Не используем устаревшие данные и ждём новый отчёт Moes после предыдущей калибровки
  - alias: Temperature reports are fresh and Moes reported after calibration changed
    condition: template
    value_template: >-
      {% set aqara = states.sensor.spalnia_datchik_temperatury_temperature %}
      {% set moes = states.sensor.spalnia_termostat_radiator_local_temperature %}
      {% set calibration = states.number.spalnia_termostat_radiator_local_temperature_calibration %}
      {% set current_time = as_timestamp(now()) %}
      {% set max_age_seconds = 21600 %}
      {{ aqara is not none and moes is not none and calibration is not none
         and (current_time - as_timestamp(aqara.last_reported, 0)) <= max_age_seconds
         and (current_time - as_timestamp(moes.last_reported, 0)) <= max_age_seconds
         and as_timestamp(moes.last_reported, 0) > as_timestamp(calibration.last_changed, 0) }}
actions:
  # Считываем исходные значения один раз для согласованного расчёта
  - variables:
      aqara_temperature: "{{ states('sensor.spalnia_datchik_temperatury_temperature') | float(0) }}"
      moes_temperature: "{{ states('sensor.spalnia_termostat_radiator_local_temperature') | float(0) }}"
      current_calibration: "{{ states('number.spalnia_termostat_radiator_local_temperature_calibration') | int(0) }}"
  # Рассчитываем новую поправку с учётом уже действующей калибровки и ограничений Moes
  - variables:
      new_calibration: >-
        {% set correction = (aqara_temperature | float(0)) - (moes_temperature | float(0)) %}
        {% set result = ((current_calibration | int(0)) + correction) | round(0) | int(0) %}
        {{ [[result, -9] | max, 9] | min }}
  # Не отправляем команду, если после округления и ограничения поправка не изменилась
  - alias: Calculated calibration differs from current calibration
    condition: template
    value_template: >-
      {{ (new_calibration | int(0)) != (current_calibration | int(0)) }}
  - action: number.set_value
    metadata: {}
    target:
      entity_id: number.spalnia_termostat_radiator_local_temperature_calibration
    data:
      value: "{{ new_calibration | int(0) }}"
mode: single
